<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>mimundial · Mundial 2026</title>
  <meta name="description" content="Fixture, tabla de posiciones y goleadores del Mundial 2026 en tiempo real.">
  <meta name="theme-color" content="#070b12">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mimundial">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#070b12; --bg-card:#0d1320; --bg-elev:#111827;
      --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.13);
      --text:#f0f4fb; --text-muted:#7a8ba0;
      --green:#00e676; --green-dim:rgba(0,230,118,.12); --green-glow:rgba(0,230,118,.25);
      --gold:#ffc107; --red:#ff4d4d;
      --font-body:'DM Sans',system-ui,sans-serif;
      --font-disp:'Plus Jakarta Sans',system-ui,sans-serif;
      --nav-h:64px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    .screen{display:none;min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
    .screen.active{display:block}

    /* NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(7,11,18,.92);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;align-items:stretch;z-index:100}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text-muted);font-family:var(--font-body);font-size:.54rem;font-weight:700;letter-spacing:.02em;cursor:pointer;text-transform:uppercase;transition:color .15s;padding:8px 2px 4px}
    .nav-item svg{width:20px;height:20px;stroke-width:1.8}
    .nav-item.active{color:var(--green)}
    .nav-item.active svg{stroke:var(--green)}

    /* HEADER */
    .app-header{position:sticky;top:0;z-index:50;background:rgba(7,11,18,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:.85rem 1.25rem;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:8px}
    .brand-icon{width:30px;height:30px;background:linear-gradient(135deg,#0d3d26,#0a2e1f);border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,230,118,.2)}
    .brand-name{font-family:var(--font-disp);font-size:1rem;font-weight:800;letter-spacing:-.02em;color:#fff}
    .brand-sub{font-size:.58rem;font-weight:600;color:var(--text-muted);letter-spacing:.01em;margin-top:1px}
    .live-badge{background:rgba(255,77,77,.15);border:1px solid rgba(255,77,77,.3);color:var(--red);font-size:.65rem;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.05em;display:none;align-items:center;gap:5px}
    .live-badge.visible{display:flex}
    .live-dot{width:6px;height:6px;background:var(--red);border-radius:50%;animation:pulse 1.2s ease infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

    /* TABS */
    .tabs-bar{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;padding:0 1.25rem;background:var(--bg);position:sticky;top:57px;z-index:40}
    .tabs-bar::-webkit-scrollbar{display:none}
    .tab-btn{font-family:var(--font-body);font-size:.8rem;font-weight:700;color:var(--text-muted);padding:.7rem 0;margin-right:1.5rem;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;transition:color .15s}
    .tab-btn.active{color:var(--text);border-bottom-color:var(--green)}

    /* FIXTURE */
    .section-hdr{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:1rem 1.25rem .5rem}
    .fixture-date-hdr{font-size:.72rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;padding:.75rem 1.25rem .3rem}
    .sub-hdr{font-size:.7rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;padding:.6rem 1.25rem .25rem;display:flex;align-items:center;gap:5px}
    .sub-hdr.live-sub{color:var(--red)}

    /* MATCH CARD */
    .match-card{margin:0 1rem .5rem;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .15s}
    .match-card.live{border-color:rgba(255,77,77,.35);background:rgba(255,77,77,.04)}
    .match-card.finished{border-color:var(--border)}
    .match-meta{display:flex;align-items:center;justify-content:space-between;padding:.55rem .9rem .3rem;font-size:.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;gap:8px}
    .match-meta-group{color:var(--green);flex-shrink:0}
    .match-venue{font-size:.62rem;font-weight:600;color:var(--text-muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;opacity:.8}
    .match-body{display:flex;align-items:center;padding:.6rem .9rem .65rem;gap:8px}
    .match-team{flex:1;display:flex;align-items:center;gap:8px}
    .match-team.right{flex-direction:row-reverse;text-align:right}
    .match-flag{font-size:1.35rem;line-height:1;flex-shrink:0}
    .match-name{font-size:.82rem;font-weight:700;color:var(--text);line-height:1.2}
    .match-center{display:flex;flex-direction:column;align-items:center;min-width:64px}
    .match-score{font-family:var(--font-disp);font-size:1.35rem;font-weight:800;letter-spacing:.04em;color:var(--text);line-height:1}
    .match-score.pending{color:var(--text-muted);font-size:1rem;letter-spacing:.1em}
    .match-time{font-size:.65rem;font-weight:700;color:var(--text-muted);margin-top:3px}
    .match-time.live{color:var(--red);display:flex;flex-direction:column;align-items:center;gap:1px}
    .live-dot-small{width:5px;height:5px;background:var(--red);border-radius:50%;display:inline-block;margin-right:3px;animation:pulse 1.2s ease infinite;vertical-align:middle}
    .match-clock{font-family:var(--font-disp);font-size:.72rem;font-weight:800;letter-spacing:.02em;color:var(--red);opacity:.85}

    /* GOALS LIST */
    .match-goals{border-top:1px solid var(--border);padding:.5rem .9rem .6rem;display:flex;flex-direction:column;gap:3px}
    .match-goals-row{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-muted)}
    .goal-flag{font-size:.9rem;line-height:1;flex-shrink:0}
    .goal-scorer{font-weight:700;color:var(--text)}
    .goal-min{font-size:.65rem;color:var(--text-muted);margin-left:auto;flex-shrink:0}
    .goal-type{font-size:.6rem;background:rgba(255,255,255,.07);border-radius:4px;padding:1px 5px;margin-left:3px;flex-shrink:0}
    .goal-type.og{background:rgba(255,77,77,.12);color:var(--red)}
    .goal-type.pen{background:rgba(255,193,7,.12);color:var(--gold)}

    /* STAGE BADGE */
    .stage-hdr{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);padding:.9rem 1.25rem .4rem;display:flex;align-items:center;gap:6px}

    /* TABLA */
    .group-standing{margin:0 1rem .75rem;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .group-standing-hdr{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem .5rem;border-bottom:1px solid var(--border)}
    .group-standing-title{font-family:var(--font-disp);font-size:.82rem;font-weight:800;color:var(--green)}
    .group-standing-cols{display:flex;align-items:center;padding:.3rem 1rem;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
    .standing-row{display:flex;align-items:center;padding:.6rem 1rem;border-top:1px solid var(--border)}
    .standing-row:first-child{border-top:none}
    .standing-pos{font-size:.72rem;font-weight:800;min-width:20px;color:var(--text-muted)}
    .standing-pos.top2{color:var(--green)}
    .standing-team{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;flex:1;min-width:0;gap:2px}
    .standing-team-info{display:flex;align-items:center;gap:7px;min-width:0}
    .standing-flag{font-size:1rem;flex-shrink:0}
    .standing-name{font-size:.8rem;font-weight:700;color:var(--text);white-space:nowrap;letter-spacing:.02em}
    .standing-stat{font-size:.78rem;font-weight:700;min-width:26px;text-align:center;color:var(--text-muted)}
    .standing-stat.pts{font-family:var(--font-disp);font-size:.9rem;font-weight:800;color:var(--text);min-width:28px}
    .standing-stat.gd{font-weight:800}
    .standing-stat.gd.pos{color:var(--green)}
    .standing-stat.gd.neg{color:var(--red)}

    /* GOLEADORES */
    .scorer-row{display:flex;align-items:center;gap:12px;padding:.7rem 1.25rem;border-bottom:1px solid var(--border)}
    .scorer-row:last-child{border-bottom:none}
    .scorer-rank{font-family:var(--font-disp);font-size:.85rem;font-weight:800;min-width:22px;color:var(--text-muted)}
    .scorer-rank.gold{color:var(--gold)}
    .scorer-rank.silver{color:#b0b8c8}
    .scorer-rank.bronze{color:#cd7f32}
    .scorer-info{flex:1}
    .scorer-name{font-size:.88rem;font-weight:700;color:var(--text)}
    .scorer-team{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:.7rem;color:var(--text-muted)}
    .scorer-goals{display:flex;align-items:center;gap:5px;background:var(--green-dim);border:1px solid var(--green-glow);border-radius:999px;padding:4px 10px}
    .scorer-goals-num{font-family:var(--font-disp);font-size:1rem;font-weight:800;color:var(--green)}
    .scorer-goals-lbl{font-size:.62rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.04em}

    /* ADMIN */
    .admin-screen{max-width:600px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
    .admin-title{font-family:var(--font-disp);font-size:1.1rem;font-weight:800;margin-bottom:1rem}
    .admin-btn{display:inline-flex;align-items:center;gap:8px;padding:.75rem 1.25rem;background:var(--green);color:#042812;border:none;border-radius:10px;font-family:var(--font-body);font-size:.88rem;font-weight:800;cursor:pointer;margin-bottom:.5rem;width:100%;justify-content:center;transition:opacity .15s}
    .admin-btn:disabled{opacity:.5;cursor:not-allowed}
    .admin-btn.ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border2)}
    .admin-input{width:100%;background:rgba(255,255,255,.05);border:1.5px solid var(--border2);border-radius:10px;padding:.75rem 1rem;color:var(--text);font-family:var(--font-body);font-size:.9rem;outline:none;margin-bottom:.75rem;transition:border-color .15s}
    .admin-input:focus{border-color:var(--green)}
    .admin-status{font-size:.78rem;color:var(--text-muted);margin-top:.5rem;min-height:1.2em}
    .admin-status.ok{color:var(--green)}
    .admin-status.err{color:var(--red)}
    .admin-stat-box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem;font-size:.82rem;color:var(--text-muted);line-height:2}

    /* EMPTY / LOADING */
    .empty-state{text-align:center;padding:3rem 1.5rem}
    .empty-icon{font-size:2.5rem;margin-bottom:.75rem}
    .empty-title{font-family:var(--font-disp);font-size:1rem;font-weight:800;margin-bottom:.4rem}
    .empty-sub{font-size:.82rem;color:var(--text-muted);line-height:1.6}
    .loading-wrap{display:flex;align-items:center;justify-content:center;padding:3rem;gap:12px;color:var(--text-muted);font-size:.85rem}
    .spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* TOAST */
    .toast{position:fixed;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1a2235;border:1px solid var(--border2);border-radius:999px;padding:.55rem 1.25rem;font-size:.8rem;font-weight:700;color:var(--text);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:200}
    .toast.visible{opacity:1}

    /* COUNTDOWN */
    .hero-banner{position:relative;overflow:hidden;background:#070b12;padding:1.5rem 1.25rem 1.25rem}
    .hero-banner::before{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=900&q=70') center 35%/cover no-repeat;opacity:.18}
    .hero-banner-content{position:relative;z-index:1}
    .hero-label{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--green);margin-bottom:.4rem}
    .hero-title{font-family:var(--font-disp);font-size:1.6rem;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1.1;margin-bottom:.75rem}
    .countdown-grid{display:flex;gap:10px;margin-bottom:.75rem}
    .cd-unit{background:rgba(255,255,255,.07);border:1px solid var(--border2);border-radius:10px;padding:.55rem .65rem;text-align:center;min-width:54px}
    .cd-num{font-family:var(--font-disp);font-size:1.4rem;font-weight:800;color:#fff;line-height:1}
    .cd-lbl{font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-top:3px}
    .hero-date{font-size:.72rem;color:rgba(255,255,255,.45)}

    @media(max-width:380px){.match-name{font-size:.75rem}.match-score{font-size:1.2rem}.standing-name{font-size:.72rem}}

    /* LIVE NOW BAR */
    #live-now-bar{background:rgba(255,77,77,.06);border-bottom:1px solid rgba(255,77,77,.18);padding-bottom:.25rem}
    .live-now-label{display:flex;align-items:center;gap:7px;padding:.65rem 1.25rem .35rem;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--red)}
    .live-now-label .live-dot{width:7px;height:7px;background:var(--red);border-radius:50%;flex-shrink:0;animation:pulse 1.2s ease infinite}
    #live-now-bar .match-card{margin:0 1rem .5rem;background:rgba(255,77,77,.08);border-color:rgba(255,77,77,.3)}

    /* RONDA DE 32 — INFORMATIVO */
    .info-banner{margin:1rem 1rem .5rem;background:rgba(255,193,7,.07);border:1px solid rgba(255,193,7,.22);border-radius:12px;padding:.7rem .9rem;font-size:.74rem;line-height:1.5;color:var(--text-muted)}
    .info-banner strong{color:var(--gold)}
    .r32-card{margin:0 1rem .5rem;background:var(--bg-card);border:1px dashed var(--border2);border-radius:14px;padding:.65rem .9rem;display:flex;align-items:center;gap:8px}
    .r32-code{font-size:.62rem;font-weight:800;color:var(--text-muted);background:rgba(255,255,255,.06);border-radius:6px;padding:2px 6px;flex-shrink:0}
    .r32-teams{flex:1;font-size:.78rem;font-weight:700;color:var(--text);line-height:1.35}
    .r32-vs{color:var(--text-muted);font-weight:600;margin:0 4px}
    .r32-date{font-size:.62rem;font-weight:700;color:var(--text-muted);flex-shrink:0;text-align:right}

    /* PROYECCIÓN */
    .proy-note{margin:-.25rem 1rem .85rem;font-size:.72rem;color:var(--text-muted);font-style:italic;padding:0 .1rem}
    .proy-match{background:var(--bg-card);margin:0 1rem .6rem;border-radius:14px;border:1px solid var(--border);padding:.85rem 1rem}
    .proy-match-header{font-size:.6rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.55rem}
    .proy-match-teams{display:flex;align-items:center;gap:6px}
    .proy-team{font-size:.88rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .proy-placeholder{font-size:.72rem;color:var(--text-muted);font-style:italic;flex:1;line-height:1.3}
    .proy-vs{font-size:.62rem;font-weight:800;color:var(--border2);flex-shrink:0;padding:0 2px}
    .qualify-rank{color:var(--gold) !important}
    .proy-out{color:var(--text-muted) !important;font-size:.7rem}

    /* EQUIPO FAVORITO */
    .match-card.fav{border-color:rgba(255,193,7,.45);background:rgba(255,193,7,.03)}
    .fav-star{background:none;border:none;cursor:pointer;font-size:.85rem;line-height:1;padding:0 3px;opacity:.25;transition:opacity .2s,transform .15s;flex-shrink:0;color:var(--gold)}
    .fav-star.active{opacity:1;transform:scale(1.15)}
    .fav-star:active{transform:scale(.9)}

    /* BADGE CLASIFICACIÓN EN GRUPOS */
    .qualify-badge{font-size:.58rem;font-weight:800;border-radius:999px;padding:1px 6px;margin-left:5px;flex-shrink:0;letter-spacing:.02em}
    .qualify-badge.ok{background:rgba(0,230,118,.13);color:var(--green);border:1px solid rgba(0,230,118,.3)}
    .qualify-badge.out{background:rgba(255,77,77,.1);color:var(--red);border:1px solid rgba(255,77,77,.22)}

    /* HISTORIAL DE GOLES EXPANDIBLE */
    .goals-toggle-btn{background:none;border:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;padding:.4rem .9rem .45rem;font-size:.7rem;font-weight:700;color:var(--text-muted);border-top:1px solid var(--border);transition:color .15s;letter-spacing:.02em}
    .goals-toggle-btn:active{opacity:.65}
    .goals-toggle-btn .tgl-count{background:rgba(255,255,255,.07);border-radius:999px;padding:1px 7px;font-size:.65rem}
    .match-goals-body{overflow:hidden;transition:max-height .28s ease,opacity .2s ease}

    /* TOAST DE GOL */
    .goal-toast{position:fixed;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) scale(.88);background:linear-gradient(135deg,#0d3d26 0%,#0a2e1f 100%);border:1.5px solid rgba(0,230,118,.45);border-radius:999px;padding:.6rem 1.5rem;font-size:.85rem;font-weight:800;color:#fff;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .22s,transform .22s;z-index:202;max-width:92vw;overflow:hidden;text-overflow:ellipsis;text-align:center;box-shadow:0 4px 24px rgba(0,230,118,.15)}
    .goal-toast.visible{opacity:1;transform:translateX(-50%) scale(1)}



    /* ESTADÍSTICAS */
    .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;margin:0 1rem .6rem;overflow:hidden}
    .stat-card-hdr{display:flex;align-items:center;gap:8px;padding:.7rem 1rem .5rem;border-bottom:1px solid var(--border);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
    .stat-row{display:flex;align-items:center;padding:.55rem 1rem;border-top:1px solid var(--border);gap:10px}
    .stat-row:first-child{border-top:none}
    .stat-rank{font-family:var(--font-disp);font-size:.82rem;font-weight:800;min-width:22px;color:var(--text-muted)}
    .stat-rank.gold{color:var(--gold)}
    .stat-main{flex:1;font-size:.84rem;font-weight:700;color:var(--text)}
    .stat-sub{font-size:.66rem;color:var(--text-muted);margin-top:1px}
    .stat-val{font-family:var(--font-disp);font-size:1rem;font-weight:800;color:var(--green);min-width:28px;text-align:right}
    .stat-val.red{color:var(--red)}
    .stat-val.gold{color:var(--gold)}
    .stat-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
    .stat-kpi{background:var(--bg-card);padding:.85rem 1rem;display:flex;flex-direction:column;gap:3px}
    .stat-kpi-num{font-family:var(--font-disp);font-size:1.4rem;font-weight:800;color:var(--green);line-height:1}
    .stat-kpi-lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
    .stat-kpi-sub{font-size:.7rem;color:var(--text-muted);margin-top:2px}
    .stat-record-row{display:flex;align-items:flex-start;padding:.6rem 1rem;border-top:1px solid var(--border);gap:10px}
    .stat-record-row:first-child{border-top:none}
    .stat-record-ico{font-size:1.1rem;flex-shrink:0;line-height:1.4}
    .stat-record-txt{flex:1}
    .stat-record-title{font-size:.8rem;font-weight:700;color:var(--text);line-height:1.3}

  // Normalizar variantes de status que usa FD.org en el Mundial 2026
  let s=m.status;
  if(s==='LIVE')      s='IN_PLAY'; // FD.org WC 2026 usa LIVE en lugar de IN_PLAY
  if(s==='HALF_TIME') s='PAUSED';  // FD.org puede usar HALF_TIME en lugar de PAUSED
  if(s==='EXTRA_TIME') s='IN_PLAY'; // tiempo extra
  if(s==='PENALTY')    s='IN_PLAY'; // tanda de penales
  if(s==='IN_PLAY'||s==='PAUSED'){
    const start=new Date(m.utcDate);
    const horasTranscurridas=(Date.now()-start)/3600000;
    if(horasTranscurridas>3) return 'FINISHED';
  }
  return s;
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pad(n){return String(n).padStart(2,'0')}
function normTla(t){return TLA_FIX[t]||t}
function flag(tla){return FLAGS[normTla(tla)]||'🏳️'}
function ls(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch{return d}}
function lsSave(k,v){localStorage.setItem(k,JSON.stringify(v))}

function showToast(msg,ms=2500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('visible');
  setTimeout(()=>t.classList.remove('visible'),ms);
}

function showGoalToast(msg,ms=4000){
  const t=document.getElementById('goal-toast');
  if(!t) return;
  clearTimeout(t._timer);
  t.textContent=msg; t.classList.add('visible');
  t._timer=setTimeout(()=>t.classList.remove('visible'),ms);
}

/* ════════ FAVORITO ════════ */
function toggleFavorite(tla,e){
  if(e){e.stopPropagation();}
  favoriteTeam=(favoriteTeam===tla)?null:tla;
  lsSave('mm_fav',favoriteTeam);
  const msg=favoriteTeam?`⭐ ${NOMBRES_ES[tla]||tla} marcado como favorito`:'Favorito eliminado';
  showToast(msg,2000);
  render();
}

function hasFavorite(m){
  if(!favoriteTeam) return false;
  return normTla(m.homeTeam?.tla||'')===favoriteTeam||normTla(m.awayTeam?.tla||'')===favoriteTeam;
}

function sortWithFavorite(matches){
  if(!favoriteTeam) return matches;
  return [...matches].sort((a,b)=>{
    const fa=hasFavorite(a)?0:1, fb=hasFavorite(b)?0:1;
    if(fa!==fb) return fa-fb;
    return new Date(a.utcDate)-new Date(b.utcDate);
  });
}

/* Obtiene el P-código de un partido KO buscando por fecha y stage en nuestras tablas */
function getKOPCode(m){
  const dateUY=fechaCortaUY(m.utcDate);
  let fixtures=[];
  if(m.stage==='LAST_32')        fixtures=RONDA32_FIFA;
  else if(m.stage==='LAST_16')   fixtures=RONDA16_FIFA;
  else if(m.stage==='QUARTER_FINALS') fixtures=RONDAQF_FIFA;
  else if(m.stage==='SEMI_FINALS')    fixtures=RONDASF_FIFA;
  if(!fixtures.length) return null;
  const sameDayFix=fixtures.filter(r=>r.fecha===dateUY);
  if(!sameDayFix.length) return null;
  if(sameDayFix.length===1) return sameDayFix[0].p;
  /* Varios partidos el mismo día: emparejar por posición según UTC */
  const sameDayApi=apiMatches.filter(am=>{
    if(am.stage!==m.stage) return false;
    return fechaCortaUY(am.utcDate)===dateUY;
  }).sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
  const idx=sameDayApi.findIndex(am=>am.id===m.id);
  if(idx>=0&&sameDayFix[idx]) return sameDayFix[idx].p;
  return sameDayFix[0].p;
}

function getVenue(m){
  if(m.venue) return typeof m.venue==='string'?m.venue:(m.venue.name||null);
  const home=normTla(m.homeTeam?.tla||'');
  const away=normTla(m.awayTeam?.tla||'');
  return SEDES_FIXTURE[`${home}-${away}`]
    || SEDES_FIXTURE[`${away}-${home}`]
    || (()=>{const p=getKOPCode(m);return p?SEDES_KO_P[p]:null;})()
    || SEDES_KO_FIJAS[m.stage]
    || null;
}

/* Fecha local UY del partido (YYYY-MM-DD) */
function matchDateUY(m){
  return new Date(m.utcDate).toLocaleDateString('es-UY',{timeZone:'America/Montevideo'}).split('/').reverse().map((p,i)=>i===0?p:p.padStart(2,'0')).join('-');
}
function todayUY(){
  return new Date().toLocaleDateString('es-UY',{timeZone:'America/Montevideo'}).split('/').reverse().map((p,i)=>i===0?p:p.padStart(2,'0')).join('-');
}
/* Fecha local UY en formato "DD/MM" (con cero adelante), para comparar contra
   el campo "fecha" de RONDA32_FIFA/RONDA16_FIFA/etc. NO usar
   toLocaleDateString con {day:'2-digit',month:'2-digit'} directo para esto:
   según el motor/ICU disponible, el mes puede devolver sin cero adelante
   (ej "28/6" en vez de "28/06"), lo que rompe la comparación de string. */
function fechaCortaUY(dateInput){
  const p=new Date(dateInput).toLocaleDateString('es-UY',{timeZone:'America/Montevideo'}).split('/');
  return `${p[0].padStart(2,'0')}/${p[1].padStart(2,'0')}`;
}

function emptyState(icon,title,sub){

function renderMatchList(matches, showDateHdr=false){
  if(!matches.length) return '';

  // Agrupar por fecha UY
  const byDate={};
  matches.forEach(m=>{

    byDate[d].push(m);

  return Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).map(([fecha,ms])=>{
    const d=new Date(fecha+'T12:00:00');

      + ms.sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate)).map(m=>matchCard(m)).join('');

/* ════════ TAB: HOY ════════ */
function renderHoy(){
  const now=new Date();
  if(now<KICKOFF && !apiMatches.length) return renderCountdown()+'<div id="news-mount"></div>';
  if(isLoading && !apiMatches.length) return `<div class="loading-wrap"><div class="spinner"></div>Cargando partidos...</div><div id="news-mount"></div>`;

  const hoy=todayUY();
  const matchesHoy=apiMatches.filter(m=>matchDateUY(m)===hoy)
    .sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));

  if(!matchesHoy.length){
    // Buscar próximo día con partidos
    const proximos=apiMatches
      .filter(m=>resolvedStatus(m)==='SCHEDULED'||resolvedStatus(m)==='TIMED')
      .sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
    if(!proximos.length) return emptyState('📅','Sin partidos hoy','No hay partidos programados para hoy.')+'<div id="news-mount"></div>';
    const proxFecha=matchDateUY(proximos[0]);
    const d=new Date(proximos[0].utcDate);
    const label=d.toLocaleDateString('es-UY',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Montevideo'});
    const matchesProx=proximos.filter(m=>matchDateUY(m)===proxFecha);
    return `<div class="empty-state" style="padding-bottom:.5rem">
        <div class="empty-icon">📅</div>
        <div class="empty-title">Sin partidos hoy</div>
        <div class="empty-sub">Próxima jornada: <strong style="color:var(--green)">${label.charAt(0).toUpperCase()+label.slice(1)}</strong></div>
      </div>
      <p class="section-hdr">Próximos partidos</p>
      ${matchesProx.map(m=>matchCard(m)).join('')}<div id="news-mount"></div>`;
  }

  // FIX: incluir partidos que ESPN ya marcó en vivo aunque FD.org diga SCHEDULED/TIMED
  const vivos=matchesHoy.filter(m=>{
    const s=resolvedStatus(m);
    if(s==='IN_PLAY'||s==='PAUSED') return true;
    const o=getLiveOverride(m.id);
    return o?.espnLive && (s==='SCHEDULED'||s==='TIMED');
  });
  const pendHoy=matchesHoy.filter(m=>{
    const s=resolvedStatus(m);
    const o=getLiveOverride(m.id);
    return (s==='SCHEDULED'||s==='TIMED') && !o?.espnLive;
  });
  const termHoy=matchesHoy.filter(m=>resolvedStatus(m)==='FINISHED');

  let html=`<p class="section-hdr" style="padding-top:.75rem">Partidos de hoy — ${matchesHoy.length} ${matchesHoy.length===1?'partido':'partidos'}</p>`;
  if(vivos.length){
    html+=`<div class="sub-hdr live-sub">⚡ En vivo ahora</div>`;
    html+=sortWithFavorite(vivos).map(m=>matchCard(m)).join('');
  }
  if(pendHoy.length){
    if(vivos.length) html+=`<div class="sub-hdr">🕐 Próximamente</div>`;
    html+=sortWithFavorite(pendHoy).map(m=>matchCard(m)).join('');
  }
  if(termHoy.length){
    html+=`<div class="sub-hdr">✓ Finalizados</div>`;
    html+=sortWithFavorite(termHoy).map(m=>matchCard(m)).join('');
  }
  return html+'<div id="news-mount"></div>';
}

/* ════════ TAB: PENDIENTES ════════ */
function renderPendientes(){
  if(isLoading && !apiMatches.length) return `<div class="loading-wrap"><div class="spinner"></div>Cargando...</div>`;
  if(!apiMatches.length) return emptyState('⚽','Sin datos','Actualizá desde el panel admin.') + renderRonda32Info();
  const pend=getMatchesByStatus('SCHEDULED','TIMED').sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
  if(!pend.length) return emptyState('✅','Todo jugado','No quedan partidos pendientes.') + renderRonda32Info();

  // Agrupar por fase
  const grupos=pend.filter(m=>m.stage==='GROUP_STAGE');
  const ko=pend.filter(m=>m.stage!=='GROUP_STAGE');
  let html='';
  if(grupos.length){
    html+=`<p class="section-hdr">Fase de Grupos — ${grupos.length} partidos</p>`;
    html+=renderMatchList(grupos, true);
  }
  if(ko.length){
    const byStage={};
    ko.forEach(m=>{if(!byStage[m.stage])byStage[m.stage]=[];byStage[m.stage].push(m);});
    const order=['LAST_32','LAST_16','QUARTER_FINALS','SEMI_FINALS','THIRD_PLACE','FINAL'];
    order.forEach(stage=>{
      const ms=byStage[stage]; if(!ms?.length) return;
      html+=`<div class="stage-hdr">🏆 ${STAGE_NAMES[stage]||stage}</div>`;
      html+=ms.sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate)).map(m=>matchCard(m)).join('');
    });
  }
  // Sección informativa fija con los cruces oficiales de Ronda de 32.
  // Se muestra siempre (no depende de apiMatches) salvo que la API ya
  // esté entregando esos partidos reales (LAST_32), para no duplicar info.
  const yaHayLast32Real=ko.some(m=>m.stage==='LAST_32');
  if(!yaHayLast32Real){
    html+=renderRonda32Info();
  }
  return html;
}

/* ════════ FUENTE LIVE (matchService) ════════
   football-data.org sigue siendo la fuente de verdad para todo:
   fixtures, equipos, grupos, tablas, resultado final. Pero su feed
   en vivo mostró datos incorrectos (ej: gol anulado por VAR que
   football-data.org no corrigió durante varios minutos).
   Para partidos EN VIVO, intentamos reemplazar marcador/estado/goles
   por ESPN (gratis, sin token, sin SLA oficial). Si ESPN falla o no
   hay match, se usa football-data.org tal cual (fallback). */

function getLiveOverride(matchId){
  const o=liveOverrides[matchId];
  if(!o) return null;
  // Vencimiento de seguridad: si el override tiene más de 90s, lo
  // tratamos como stale y dejamos de confiar en él (puede pasar si
  // dejó de actualizarse silenciosamente, ej. ESPN cambió el id).
  if(Date.now()-o.fetchedAt>90*1000) return null;
  return o;
}

/* Matchea un partido de football-data.org contra los eventos de ESPN
   por código de equipo (tla, 3 letras FIFA — mismo formato en ambas
   fuentes) + ventana de fecha amplia (±6h) para tolerar diferencias
   de reloj/timezone entre ambas fuentes. */
function findEspnMatch(m,espnEvents){
  const homeTla=normTla(m.homeTeam?.tla||'');
  const awayTla=normTla(m.awayTeam?.tla||'');
  if(!homeTla||!awayTla) return null;
  const kickoff=new Date(m.utcDate).getTime();
  return espnEvents.find(ev=>{
    if(!ev.home||!ev.away) return false;
    const evHome=normTla(ev.home.tla||'');
    const evAway=normTla(ev.away.tla||'');
    const mismosEquipos=(evHome===homeTla&&evAway===awayTla)||(evHome===awayTla&&evAway===homeTla);
    if(!mismosEquipos) return false;
    const evKickoff=new Date(ev.date).getTime();
    return Math.abs(evKickoff-kickoff)<6*60*60*1000;
  })||null;
}

/* Parsea el displayClock de ESPN ("67'", "45+2'", "HT", "FT") a
   {minute, injuryTime} en el mismo formato que usa liveClockLabel. */
function parseEspnClock(displayClock){
  if(!displayClock) return {minute:null,injuryTime:0};
  const m=displayClock.match(/(\d+)(?:\+(\d+))?/);
  if(!m) return {minute:null,injuryTime:0};
  const base=Number(m[1]);
  const extra=m[2]?Number(m[2]):0;
  return {minute:base+extra,injuryTime:extra};
}

async function fetchLiveData(){
  try{
    const resp=await fetch('/api/live');
    if(!resp.ok) throw new Error('live '+resp.status);
    const data=await resp.json();
    const espnEvents=data.events||[];

    // FIX: También mirar SCHEDULED/TIMED — FD.org tarda 1-5 min en actualizar
    // el status a IN_PLAY. ESPN sabe antes que el partido arrancó.
    const candidatos=apiMatches.filter(m=>{
      const s=resolvedStatus(m);
      return s==='IN_PLAY'||s==='PAUSED'||s==='SCHEDULED'||s==='TIMED';
    });
    const nextOverrides={};
    candidatos.forEach(m=>{
      const ev=findEspnMatch(m,espnEvents);
      if(!ev||ev.state!=='in') return; // ESPN no lo marca como en juego: ignorar
      const homeTla=normTla(m.homeTeam?.tla||'');
      const evHome=normTla(ev.home.tla||'');
      const espnHomeIsFdHome=(evHome===homeTla);
      const {minute,injuryTime}=parseEspnClock(ev.clock);
      const fdStatus=resolvedStatus(m);
      nextOverrides[m.id]={
        homeScore: espnHomeIsFdHome ? ev.home.score : ev.away.score,
        awayScore: espnHomeIsFdHome ? ev.away.score : ev.home.score,
        minute, injuryTime,
        fetchedAt: Date.now(),
        espnLive: fdStatus==='SCHEDULED'||fdStatus==='TIMED',
        // Goles de ESPN — reorientar isHome si ESPN y FD.org tienen local/visitante invertidos
        goals: (ev.goals||[]).map(g=>espnHomeIsFdHome ? g : {...g, isHome: !g.isHome}),
      };
    });
    // Detectar goles nuevos comparando vs el ciclo anterior
    Object.entries(nextOverrides).forEach(([id,next])=>{
      const prev=prevLiveScores[id];
      if(prev&&(next.homeScore!==prev.h||next.awayScore!==prev.a)){
        const m=apiMatches.find(mm=>String(mm.id)===String(id));
        if(m){
          const hName=teamName(m,'homeTeam');
          const aName=teamName(m,'awayTeam');
          const hF=flag(normTla(m.homeTeam?.tla||''));
          const aF=flag(normTla(m.awayTeam?.tla||''));
          const gMsg=`⚽ GOL! ${hF} ${hName} ${next.homeScore}–${next.awayScore} ${aName} ${aF}`;
          showGoalToast(gMsg,5000);
          sendBrowserNotif('⚽ ¡GOOOL!',`${hName} ${next.homeScore}–${next.awayScore} ${aName}`,'goal-'+id);
        }
      }
      prevLiveScores[id]={h:next.homeScore,a:next.awayScore};
    });

    liveOverrides=nextOverrides;
    liveFetchFailed=false;
  }catch(e){
    // Fallback: no tocamos liveOverrides existentes más que dejarlos
    // expirar por su propio chequeo de 90s; matchCard cae sola a
    // football-data.org cuando getLiveOverride devuelve null.
    liveFetchFailed=true;
    console.warn('[mimundial] fuente LIVE no disponible, usando football-data.org:',e);
  }
}

function scheduleLiveRefresh(){
  if(liveTimer) clearInterval(liveTimer);
  const hasLive=apiMatches.some(m=>{const s=resolvedStatus(m);return s==='IN_PLAY'||s==='PAUSED'});
  // FIX: también arrancar el timer si ESPN ya detectó partidos aunque FD.org no actualizó todavía
  const hasEspnLive=Object.values(liveOverrides).some(o=>o.espnLive);
  if(!hasLive && !hasEspnLive){ liveOverrides={}; return; }
  /* No relanzamos fetchLiveData() aquí: fetchAndUpdate() ya lo esperó
     antes de llamar a esta función, así que liveOverrides ya está al
     día en el momento en que arrancamos este timer. */
  liveTimer=setInterval(async ()=>{
    await fetchLiveData();
    render();
  },15*1000); // 15s — más agresivo que el polling de football-data.org porque es liviano (sin token, cache corto)
}


/* Nodo de "posible cruce": si esa fase/código ya tiene equipos reales
   asignados (aunque el partido no se haya jugado), devuelve un nodo
   'known' con los 2 equipos. Si no, baja un nivel (Cuartos→Octavos,
   Semis→Cuartos, y si Cuartos tampoco está resuelto, sigue bajando
   solo hasta llegar a Octavos, que siempre tiene equipos reales una
   vez terminada la Ronda de 32) y devuelve un nodo 'pending' con los
   dos sub-cruces que lo van a definir. */
function feederNode(stage, pcode){
  if(!pcode) return null;
  const rm=apiMatches.find(x=>x.stage===stage && getKOPCode(x)===pcode);
  if(rm && (rm.homeTeam?.tla || rm.awayTeam?.tla)){
    return {type:'known',
      h:teamName(rm,'homeTeam'), a:teamName(rm,'awayTeam'),
      hf:rm.homeTeam?.tla?flag(normTla(rm.homeTeam.tla)):'🏳️',
      af:rm.awayTeam?.tla?flag(normTla(rm.awayTeam.tla)):'🏳️'};
  }
  if(stage==='QUARTER_FINALS'){
    const r=RONDAQF_FIFA.find(x=>x.p===pcode);
    if(!r) return null;
    return {type:'pending', a:feederNode('LAST_16', r.r16a), b:feederNode('LAST_16', r.r16b)};
  }
  if(stage==='SEMI_FINALS'){
    const r=RONDASF_FIFA.find(x=>x.p===pcode);
    if(!r) return null;
    return {type:'pending', a:feederNode('QUARTER_FINALS', r.qfa), b:feederNode('QUARTER_FINALS', r.qfb)};
  }
  return null;
}

/* Dibuja el nodo con el mismo estilo de fila que usa Octavos (bandera +
   nombre a cada lado). Si es 'pending', se llama a sí misma para
   mostrar los dos sub-cruces que lo van a definir (así llega solo
   hasta Octavos cuando hace falta bajar 2 niveles, ej. desde Semis). */
function renderFeederTree(node){
  if(!node) return `<div style="text-align:center;font-size:.62rem;font-style:italic;color:rgba(220,220,240,.3);padding:4px 0">Por definir</div>`;
  if(node.type==='known'){
    return `<div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:3px 4px">
      <span style="font-size:.65rem;font-weight:700;display:inline-flex;align-items:center;gap:3px;white-space:nowrap">${node.hf} ${esc(node.h)}</span>
      <span style="font-size:.55rem;color:var(--text-muted);font-weight:700">vs</span>
      <span style="font-size:.65rem;font-weight:700;display:inline-flex;align-items:center;gap:3px;white-space:nowrap">${node.af} ${esc(node.a)}</span>
    </div>`;
  }
  return `<div style="border:1px dashed rgba(255,255,255,.14);border-radius:8px;padding:3px 4px;margin:2px 0">
    ${renderFeederTree(node.a)}
    <div style="text-align:center;font-size:.48rem;color:rgba(220,220,240,.28);font-weight:800;margin:0">▼</div>
    ${renderFeederTree(node.b)}
  </div>`;
}

/* Línea "posibles cruces" para partidos de Cuartos/Semis que todavía no
   tienen equipos reales asignados: reemplaza el hueco en blanco por el
   árbol de arriba, con el mismo estilo (bandera + nombre) que Octavos. */
function posiblesCrucesLine(m){
  if(m.homeTeam?.tla || m.awayTeam?.tla) return ''; // ya hay equipo real, no hace falta
  if(m.stage!=='QUARTER_FINALS' && m.stage!=='SEMI_FINALS') return '';
  const code=getKOPCode(m);
  const node=feederNode(m.stage, code);
  if(!node || node.type==='known') return '';
  return `<div class="match-possible-hint" style="padding:6px 10px 10px">
    <div style="font-size:.55rem;color:var(--text-muted);text-align:center;margin-bottom:4px;font-weight:700;letter-spacing:.04em">🔮 POSIBLES CRUCES</div>
    <div style="display:flex;align-items:stretch;gap:6px">
      <div style="flex:1;min-width:0">${renderFeederTree(node.a)}</div>
      <div style="align-self:center;font-size:.6rem;font-weight:800;color:var(--gold)">VS</div>
      <div style="flex:1;min-width:0">${renderFeederTree(node.b)}</div>
    </div>
  </div>`;
}

function matchCard(m){
  const homeTla=m.homeTeam?.tla ? normTla(m.homeTeam.tla) : null;
  const awayTla=m.awayTeam?.tla ? normTla(m.awayTeam.tla) : null;
  const homeName=teamName(m,'homeTeam');
  const awayName=teamName(m,'awayTeam');
  const homeFlag=homeTla?flag(homeTla):'🏳️';
  const awayFlag=awayTla?flag(awayTla):'🏳️';

  const status=resolvedStatus(m);
  const _espnOverride=getLiveOverride(m.id);
  // FIX: tratar como LIVE si FD.org dice SCHEDULED/TIMED pero ESPN ya lo marcó en juego
  const isLive=(status==='IN_PLAY'||status==='PAUSED')||(_espnOverride?.espnLive&&(status==='SCHEDULED'||status==='TIMED'));
  const isPaused=status==='PAUSED'; // entretiempo: el reloj NO debe avanzar
  const isFin=status==='FINISHED';
  const scoreH=m.score?.fullTime?.home;
  const scoreA=m.score?.fullTime?.away;

  const utc=new Date(m.utcDate);
  const timeStr=utc.toLocaleTimeString('es-UY',{hour:'2-digit',minute:'2-digit',timeZone:'America/Montevideo'});

  /* Sede */
  const venue=getVenue(m);

  /* Grupo */
  const groupLabel=m.group?('Grupo '+m.group.replace('GROUP_','')):
                   m.stage?STAGE_NAMES[m.stage]||m.stage:'';

  /* Score / status */
  let scoreHtml,statusHtml;
  if(isLive){
    const override=getLiveOverride(m.id);
    const h=override ? override.homeScore : (scoreH??m.score?.halfTime?.home??0);
    const a=override ? override.awayScore : (scoreA??m.score?.halfTime?.away??0);
    const minute=override ? override.minute : m.minute;
    const injuryTime=override ? override.injuryTime : m.injuryTime;
    const clockBase=override ? override.fetchedAt : (lastUpdated||Date.now());
    scoreHtml=`<div class="match-score">${h} - ${a}</div>`;
    if(isPaused){
      /* Entretiempo: el reloj se queda fijo en el último minuto real
         conocido (normalmente 45' o 45+N'). data-clock-paused="1" le
         dice a clockTick() que no le sume segundos — si lo dejáramos
         correr, terminaría sumando los ~10-15 min reales de descanso
         como si fueran minutos de juego (bug real que se reportó). */
      statusHtml=`<div class="match-time live">
        <span class="live-dot-small"></span>ENTRETIEMPO
        <span class="match-clock" data-clock-paused="1" data-clock-min="${minute??''}" data-clock-injury="${injuryTime??''}" data-clock-base="${clockBase}">${liveClockLabel(minute,injuryTime,0)}</span>
      </div>`;
    } else {
      /* El minuto avanza vía clockTick() cada segundo, sin re-renderizar
         toda la tarjeta. data-clock-base = timestamp del último dato
         real (de ESPN si hay override, o de football-data.org si no);
         a partir de ahí se extrapola el minuto visualmente. */
      statusHtml=`<div class="match-time live">
        <span class="live-dot-small"></span>EN VIVO
        <span class="match-clock" data-clock-min="${minute??''}" data-clock-injury="${injuryTime??''}" data-clock-base="${clockBase}">${liveClockLabel(minute,injuryTime,0)}</span>
      </div>`;
    }
  } else if(isFin && scoreH!=null){
    const etH=m.score?.extraTime?.home;
    const etA=m.score?.extraTime?.away;
    const penH=m.score?.penalties?.home;
    const penA=m.score?.penalties?.away;
    let dispH,dispA,finalLabel;
    if(penH!=null){
      /* Partido definido por penales: marcador regular en grande + "Pen X-Y" */
      dispH=scoreH; dispA=scoreA;
      finalLabel=`Final &nbsp;<span class="final-tag pen">Pen. ${penH}-${penA}</span>`;
    } else if(etH!=null){
      /* Prórroga sin penales: mostrar marcador final de ET */
      dispH=etH; dispA=etA;
      finalLabel='Final &nbsp;<span class="final-tag et">Prórroga</span>';
    } else {
      dispH=scoreH; dispA=scoreA;
      finalLabel='Final';
    }
    scoreHtml=`<div class="match-score">${dispH} - ${dispA}</div>`;
    statusHtml=`<div class="match-time">${finalLabel}</div>`;
  } else {
    const dateStr=utc.toLocaleDateString('es-UY',{weekday:'short',day:'numeric',month:'short',timeZone:'America/Montevideo'});
    scoreHtml=`<div class="match-score pending" style="font-size:.9rem;line-height:1.15">${timeStr}<div style="font-size:.58rem;font-weight:700;letter-spacing:.03em;margin-top:3px;color:var(--text-muted)">${dateStr}</div></div>`;
    statusHtml=`<div class="match-time">${timeStr} UY</div>`;
  }

  const isFav=hasFavorite(m);
  const cls=`${isLive?'live':isFin?'finished':''} ${isFav?'fav':''}`.trim();

  const homeFavBtn=homeTla?`<button class="fav-star ${favoriteTeam===homeTla?'active':''}" onclick="toggleFavorite('${homeTla}',event)" title="${favoriteTeam===homeTla?'Quitar favorito':'Marcar como favorito'}">★</button>`:'';
  const awayFavBtn=awayTla?`<button class="fav-star ${favoriteTeam===awayTla?'active':''}" onclick="toggleFavorite('${awayTla}',event)" title="${favoriteTeam===awayTla?'Quitar favorito':'Marcar como favorito'}">★</button>`:'';

  /* ── GOLES EXPANDIBLES ──
     Si hay override de ESPN activo, solo mostramos la lista de
     goleadores (que viene de football-data.org, m.goals) cuando su
     cantidad total coincide con el marcador que confirmó ESPN.
     Si no coincide (ej: gol anulado por VAR que football-data.org
     no actualizó todavía), preferimos no mostrar nada antes que
     mostrar un goleador que ya no es válido. */
  let goalsSection='';
  const goals=m.goals||[];
  const liveOverrideForGoals=isLive?getLiveOverride(m.id):null;
  const espnGoals=liveOverrideForGoals?.goals||[];
  const espnTotal=espnGoals.length;
  const fdTotal=goals.length;
  const espnLiveScore = liveOverrideForGoals
    ? (liveOverrideForGoals.homeScore + liveOverrideForGoals.awayScore) : 0;
  const goalsConfiables = !liveOverrideForGoals || fdTotal <= espnLiveScore + 1;

  const sid=String(m.id);
  const isOpen=expandedGoals.has(sid);

  const anyGoalsData = fdTotal > 0 || espnTotal > 0
    || (liveOverrideForGoals && espnLiveScore > 0);
  if((isLive||isFin) && anyGoalsData){
    let rows='';

    if(goalsConfiables && fdTotal>0){
      // Fuente primaria: FD.org (tiene nombre completo en español si está disponible)
      const homeId=m.homeTeam?.id;
      rows=goals.map(g=>{
        const isHome=g.team?.id===homeId;
        const scorerTla=normTla(g.team?.tla||'');
        const scorerFlag=scorerTla?flag(scorerTla):(isHome?homeFlag:awayFlag);
        const name=g.scorer?.name||'Gol propio';
        const min=g.minute!=null?(g.minute+(g.injuryTime?'+'+g.injuryTime:''))+"'":'-';
        let typeTag='';
        if(g.type==='OWN_GOAL') typeTag=`<span class="goal-type og">OG</span>`;
        else if(g.type==='PENALTY') typeTag=`<span class="goal-type pen">P</span>`;
        return `<div class="match-goals-row">
          <span class="goal-flag">${scorerFlag}</span>
          <span class="goal-scorer">${esc(name)}</span>${typeTag}
          <span class="goal-min">${min}</span>
        </div>`;
      }).join('');
    } else if(espnTotal>0){
      // Fallback: goles de ESPN cuando FD.org no coincide o todavía no los tiene
      rows=espnGoals.map(g=>{
        const scorerFlag=g.isHome?homeFlag:awayFlag;
        const name=g.scorer||'Gol propio';
        const min=g.minute||'-';
        let typeTag='';
        if(g.ownGoal) typeTag=`<span class="goal-type og">OG</span>`;
        else if(g.penalty) typeTag=`<span class="goal-type pen">P</span>`;
        return `<div class="match-goals-row">
          <span class="goal-flag">${scorerFlag}</span>
          <span class="goal-scorer">${esc(name)}</span>${typeTag}
          <span class="goal-min">${min}</span>
        </div>`;
      }).join('');
    }

    if(!rows && liveOverrideForGoals && espnLiveScore > 0){
      rows = '<div class="match-goals-row" style="opacity:.5;font-style:italic;justify-content:center">'
           + '<span class="goal-scorer">⚽ Gol — goleador actualizándose</span>'
           + '</div>';
    }
    if(rows){
      const count=goalsConfiables&&fdTotal>0?fdTotal:espnTotal;
      const goalsInner=`<div class="match-goals">${rows}</div>`;
      goalsSection=`
        <button class="goals-toggle-btn" data-id="${sid}" onclick="toggleGoals(${sid},event)">
          <span>⚽</span>
          <span class="tgl-lbl">${isOpen?'Ocultar':'Ver goles'}</span>
          <span class="tgl-count">${count}</span>
        </button>
        <div class="match-goals-body" data-id="${sid}" style="max-height:${isOpen?'600px':'0'};opacity:${isOpen?'1':'0'}">
          ${goalsInner}
        </div>`;
    }
  }

  return `<div class="match-card ${cls}">
    <div class="match-meta">
      <span class="match-meta-group">${esc(groupLabel)}</span>
      ${venue?`<span class="match-venue">📍 ${esc(venue)}</span>`:`<span></span>`}
    </div>
    <div class="match-body">
      <div class="match-team">
        <span class="match-flag">${homeFlag}</span>
        <span class="match-name">${esc(homeName)}</span>
        ${homeFavBtn}
      </div>
      <div class="match-center">${scoreHtml}${statusHtml}</div>
      <div class="match-team right">
        ${awayFavBtn}
        <span class="match-name">${esc(awayName)}</span>
        <span class="match-flag">${awayFlag}</span>
      </div>
    </div>
    ${goalsSection}
    ${posiblesCrucesLine(m)}
  </div>`;
}

function updateLiveBadge(){
  // FIX: incluir partidos que ESPN ya marcó en vivo aunque FD.org diga SCHEDULED/TIMED
  const vivos=apiMatches.filter(m=>{
    const s=resolvedStatus(m);
    if(s==='IN_PLAY'||s==='PAUSED') return true;
    const o=getLiveOverride(m.id);
    return o?.espnLive && (s==='SCHEDULED'||s==='TIMED');
  });
  const hasLive=vivos.length>0;
  document.getElementById('live-badge').classList.toggle('visible',hasLive);

  // Live now bar — encima de las tabs.
  // Se oculta en "Hoy" y "En Vivo" porque esas tabs ya muestran los
  // partidos en vivo dentro del cuerpo (evita verlos duplicados).
  const bar=document.getElementById('live-now-bar');
  const cardsEl=document.getElementById('live-now-cards');
  if(!bar||!cardsEl) return;
  const yaVisibleEnTab=(currentTab==='hoy'||currentTab==='envivo');
  if(!hasLive || yaVisibleEnTab){ bar.style.display='none'; return; }
  bar.style.display='block';
  cardsEl.innerHTML=vivos.sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate)).map(m=>matchCard(m)).join('');
}

/* ════════ FETCH ════════ */
async function fetchAndUpdate(){
  const key=localStorage.getItem('mimundial_livegoals_key')||'6ba9bc9e2b8344bf88a4af3ef75ecc1d';
  isLoading=true;
  let resp;
  try{
    resp=await fetch(`/api/results?key=${encodeURIComponent(key)}`);
  }catch(e){ isLoading=false; throw e; }
  if(!resp.ok){ isLoading=false; throw new Error('Error '+resp.status); }
  const data=await resp.json();

  // Guardia 1: no reemplazar apiMatches si la respuesta viene vacía (error, rate limit, etc.)
  const newMatches=data.matches?.matches||[];
  if(newMatches.length>0||apiMatches.length===0){
    // Guardia 2: no aceptar FINISHED prematuro. FD.org a veces marca FINISHED
    // por error y lo corrige en el siguiente ciclo. Si el partido estaba en vivo
    // y FD.org dice FINISHED pero llevamos menos de 85 minutos, lo ignoramos.
    const guardedMatches=newMatches.map(m=>{
      if(resolvedStatus(m)!=='FINISHED') return m;
      const prev=prevLiveStatuses[m.id];
      const wasLive=prev==='IN_PLAY'||prev==='PAUSED';
      if(!wasLive) return m;
      const elapsed=(Date.now()-new Date(m.utcDate))/60000;
      if(elapsed<85) return {...m, status: 'LIVE'}; // revertir hasta el próximo ciclo
      return m;
    });
    // Detectar partidos que acaban de arrancar (SCHEDULED/TIMED → IN_PLAY)
    if(Object.keys(prevLiveStatuses).length>0){
      guardedMatches.forEach(m=>{
        const prev=prevLiveStatuses[m.id];
        const curr=resolvedStatus(m);
        if(prev&&(prev==='SCHEDULED'||prev==='TIMED')&&(curr==='IN_PLAY'||curr==='PAUSED')){
          const hName=teamName(m,'homeTeam');
          const aName=teamName(m,'awayTeam');
          sendBrowserNotif('⚡ ¡Arranca ahora!',`${hName} vs ${aName}`,'start-'+m.id);
        }
      });
    }
    apiMatches=guardedMatches;
    lsSave('mm_matches',apiMatches);
    apiMatches.forEach(m=>{prevLiveStatuses[m.id]=resolvedStatus(m);});
  }

  const rawStandings=data.standings?.standings||[];
  apiStandings=rawStandings.filter(s=>s.type==='TOTAL');
  lsSave('mm_standings',apiStandings);

  apiScorers=data.scorers?.scorers||[];
  lsSave('mm_scorers',apiScorers);

  /* Si hay partidos en vivo o recién comenzados (dentro de ±30 min del horario),
     consultamos ESPN antes de pintar. FD.org tiene 1-5 min de delay para pasar
     de SCHEDULED → IN_PLAY, así que también consultamos ESPN cuando hay partidos
     que deberían estar arrancando según el horario. */
  const hasLive=apiMatches.some(m=>{const s=resolvedStatus(m);return s==='IN_PLAY'||s==='PAUSED'});
  const hayProximosORecientes=apiMatches.some(m=>{
    const s=resolvedStatus(m);
    if(s!=='SCHEDULED'&&s!=='TIMED') return false;
    const diff=(new Date(m.utcDate)-Date.now())/60000; // minutos hasta el partido
    return diff>-35 && diff<5; // dentro de 35 min después o 5 min antes del horario
  });
  if(hasLive||hayProximosORecientes) await fetchLiveData();

  isLoading=false;
  lastUpdated=Date.now();
  render();
  scheduleRefresh();
  scheduleLiveRefresh();
}

function loadLocal(){
  const m=ls('mm_matches',null);
  const s=ls('mm_standings',null);
  const sc=ls('mm_scorers',null);
  if(m) apiMatches=m;
  if(s) apiStandings=s;
  if(sc) apiScorers=sc;
}



/* Marcador "real" de un partido: football-data.org, cuando el partido se
   define por penales, mete los goles del shootout DENTRO de score.fullTime
   (ver docs: duration=PENALTY_SHOOTOUT ⇒ fullTime = regularTime + extraTime
   + penalties). Si contamos fullTime tal cual, un 1-1 que se definió 4-3 en
   penales aparece como si hubiera terminado 5-4. Acá se descsurvienen los
   penales y se deja sólo lo jugado en cancha (90' + alargue si hubo). */
function realScore(m){
  const sc=m.score;
  if(!sc) return {home:0,away:0};
  if(sc.duration==='PENALTY_SHOOTOUT'){
    const rt=sc.regularTime||{home:0,away:0};
    const et=sc.extraTime||{home:0,away:0};
    return {home:(rt.home??0)+(et.home??0), away:(rt.away??0)+(et.away??0)};
  }
  return {home:sc.fullTime?.home??0, away:sc.fullTime?.away??0};
}

/* ════════ RELOJ LOCAL DE PARTIDOS EN VIVO ════════
   Entre cada fetch a la API (cada 30s), avanzamos el minuto
   visualmente en el cliente para dar sensación de tiempo real.
   No inventa datos: extrapola desde el último minuto real conocido. */
function liveClockLabel(apiMinute,injuryTime,extraSeconds){
  if(apiMinute==null) return '';
  extraSeconds=extraSeconds||0;
  /* football-data.org, cuando hay descuento, manda minute ya sumado
     (ej: minute=47, injuryTime=3 significa "45+2"). Detectamos el
     límite de la parte real restando el descuento ya transcurrido. */
  const baseHalf=apiMinute-(injuryTime||0)<=45?45:90;
  const inInjury=injuryTime>0 && apiMinute>=baseHalf;

  if(inInjury){
    let extraMin=apiMinute-baseHalf; // 0 = recién empieza el descuento
    let sec=extraSeconds%60;
    extraMin=extraMin+Math.floor(extraSeconds/60);
    if(extraMin>=injuryTime){extraMin=injuryTime;sec=0;} // tope: no inventar más descuento del informado
    return `${baseHalf}+${extraMin}:${String(sec).padStart(2,'0')}`;
  }

  /* El reloj avanza siempre, sin pausas de espera: simplificado a
     propósito tras un bug donde el reloj quedaba "trancado" varios
     segundos justo después de un reload (esperando confirmación de
     descuento que no llegaba a tiempo). El próximo fetch real (cada
     15-30s) corrige el minuto si hace falta, así que es preferible
     un reloj siempre predecible a uno que se pausa esperando datos. */
  let totalSec=apiMinute*60+extraSeconds;
  let min=Math.floor(totalSec/60);
  const sec=totalSec%60;
  return `${min}:${String(sec).padStart(2,'0')}`;
}

function clockTick(){
  const found=document.querySelectorAll('.match-clock');
  found.forEach(el=>{
    const apiMin=el.dataset.clockMin;
    if(apiMin===''||apiMin==null) return;
    if(el.dataset.clockPaused==='1') return; // entretiempo: no avanzar, dejar el texto tal cual quedó
    const base=Number(el.dataset.clockBase)||Date.now();
    const injuryTime=Number(el.dataset.clockInjury)||0;
    const elapsedSec=Math.floor((Date.now()-base)/1000);
    el.textContent=liveClockLabel(Number(apiMin),injuryTime,elapsedSec);
  });
  if(isDebug()) updateDebugPanel(found);
}

/* ════════ PANEL DE DIAGNÓSTICO (?debug=1) ════════
   Para investigar el bug del reloj trancado sin necesitar devtools
   en el celular. No requiere ninguna acción del usuario más que
   abrir la URL con ?debug=1 — el panel aparece flotando abajo. */
function isDebug(){return new URLSearchParams(location.search).get('debug')==='1'}

function ensureDebugPanel(){
  if(document.getElementById('debug-panel')) return;
  const div=document.createElement('div');
  div.id='debug-panel';
  div.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font:11px monospace;padding:8px;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap;border-top:2px solid #0f0';
  document.body.appendChild(div);
}

function updateDebugPanel(clockEls){
  ensureDebugPanel();
  const panel=document.getElementById('debug-panel');
  let lines=[`[DEBUG] ${new Date().toLocaleTimeString()} — Date.now()=${Date.now()}`];
  lines.push(`clockTimer activo: ${clockTimer!==null}`);
  lines.push(`elementos .match-clock encontrados: ${clockEls.length}`);
  clockEls.forEach((el,i)=>{
    const base=Number(el.dataset.clockBase);
    lines.push(`  #${i}: texto="${el.textContent}" min=${el.dataset.clockMin} injury=${el.dataset.clockInjury} base=${base} diffSeg=${Math.floor((Date.now()-base)/1000)}`);
  });
  lines.push(`liveOverrides: ${JSON.stringify(liveOverrides)}`);
  lines.push(`lastUpdated: ${lastUpdated} (hace ${lastUpdated?Math.floor((Date.now()-lastUpdated)/1000):'?'}s)`);
  panel.textContent=lines.join('\n');
}

/* ════════ INDICADOR DE ACTUALIZACIÓN ════════ */
function updateElapsed(){
  const el=document.getElementById('sync-elapsed');
  if(!el) return;
  if(!lastUpdated){el.textContent='';return;}
  const sec=Math.floor((Date.now()-lastUpdated)/1000);
  if(sec<10) el.textContent='Actualizado ahora';
  else if(sec<60) el.textContent=`Actualizado hace ${sec}s`;
  else el.textContent=`Actualizado hace ${Math.floor(sec/60)}m`;
}

function scheduleRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  const hasLive=apiMatches.some(m=>{const s=resolvedStatus(m);return s==='IN_PLAY'||s==='PAUSED'});
  // FIX: también refrescar cada 30s si ESPN ya detectó partidos vivos
  const hasEspnLive=Object.values(liveOverrides).some(o=>o.espnLive);
  // FIX: intervalo corto (90s) cuando hay partidos por arrancar en los próximos 30 min
  // así no tardamos 10 min en detectar el inicio del partido
  const proximos=apiMatches.some(m=>{
    const s=resolvedStatus(m);
    if(s!=='SCHEDULED'&&s!=='TIMED') return false;
    const diff=(new Date(m.utcDate)-Date.now())/60000;
    return diff>-5 && diff<30; // entre 5 min antes y 30 min después de la hora programada
  });
  const interval=(hasLive||hasEspnLive) ? 30*1000 : proximos ? 90*1000 : 10*60*1000;
  refreshTimer=setInterval(async ()=>{
    try{
      await fetchAndUpdate();
      /* fetchAndUpdate llama a scheduleRefresh() al final,
         así que el intervalo se recalcula automáticamente
         si cambia el estado (vivo ↔ sin partido) */
    }catch(e){ console.warn('[mimundial] refresh:',e); }
  },interval);
}

/* ════════ BOOT ════════ */
async function boot(){
  loadLocal();
  if(isAdmin()) initAdmin();
  render();
  // Pedimos permiso de notificaciones la primera vez que el usuario interactúa
  document.addEventListener('click',requestNotifPermission,{once:true});
  elapsedTimer=setInterval(updateElapsed,1000);
  clockTimer=setInterval(clockTick,1000);
  if(new Date()>=KICKOFF){
    isLoading=true; render();
    try{ await fetchAndUpdate(); }
    catch(e){ isLoading=false; render(); console.warn('[mimundial]',e); }
  } else {
    /* Antes del torneo: igual programar refresh para cuando arranque */
    scheduleRefresh();
  }
}

boot();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
