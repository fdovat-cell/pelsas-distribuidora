<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PelSAS · Distribuidora</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1A18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PelSAS">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F5F0E8;
  --cream2:#EDE8DF;
  --cream3:#E4DDD2;
  --ink:#1A1A18;
  --ink2:#3D3B36;
  --mid:#7A7468;
  --light:#B0AA9E;
  --red:#B02020;
  --red-dark:#8A1818;
  --red-light:#F8EDED;
  --border:#D8D2C6;
  --border2:#C8C2B4;
  --white:#FFFFFF;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2.5rem;height:62px;
  background:var(--white);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:baseline;gap:12px}
.logo-name{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:900;
  color:var(--ink);letter-spacing:0.01em;
}
.logo-name span{color:var(--red)}
.logo-divider{width:1px;height:14px;background:var(--border2)}
.logo-city{font-size:11px;color:var(--light);letter-spacing:0.1em;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:16px}
.tel{font-size:12px;color:var(--mid);letter-spacing:0.04em}
.cart-btn{
  display:flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--white);
  border:none;border-radius:8px;
  padding:11px 20px;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;transition:background .15s;
  box-shadow:0 2px 8px rgba(26,26,24,.18);
}
.cart-btn:hover{background:var(--ink2)}
.badge{
  background:var(--red);color:#fff;
  border-radius:50%;width:20px;height:20px;
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* HOME */
.hero-split{
  display:grid;
  grid-template-columns:1fr 1.6fr;
  gap:3rem;
  align-items:start;
  margin-bottom:3rem;
}
.hero-cats{display:flex;flex-direction:column}
@media(max-width:720px){
  .hero-split{grid-template-columns:1fr;gap:1.5rem}
}
.home-wrap{max-width:1140px;margin:0 auto;padding:2rem 2.5rem}

.hero-row{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;margin-bottom:1.5rem}
.hero-left{}
.hero-eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:1.25rem}
.hero-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(38px,5vw,68px);
  font-weight:900;line-height:1.0;
  color:var(--ink);margin-bottom:1.5rem;
}
.hero-title em{font-style:italic;color:var(--red)}
.hero-body{font-size:15px;color:var(--mid);line-height:1.7;max-width:380px;margin-bottom:2rem}
.hero-rule{width:40px;height:2px;background:var(--red);margin-bottom:2rem}
.hero-stats{display:flex;gap:2rem}
.stat{border-left:2px solid var(--border2);padding-left:1rem}
.stat-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--ink)}
.stat-lbl{font-size:11px;color:var(--light);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

/* SECTION DIVIDER */
.section-eyebrow{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--light);margin-bottom:.5rem;
}
.section-rule-line{
  height:1px;background:var(--border);margin-bottom:1.25rem;
}

/* COLLAGE CARDS */
.collage-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:5rem}
.col-card{
  border-radius:16px;overflow:hidden;cursor:pointer;
  border:1px solid var(--border);
  background:var(--white);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.col-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(26,26,24,.1);border-color:var(--border2)}

.col-visual{height:auto;display:flex;align-items:center;justify-content:center;padding:0;position:relative;overflow:hidden}
.col-card.alimentos .col-visual{
  background:var(--cream);
  padding:0;
  height:300px;
}
.col-card.alimentos .col-visual img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .3s ease;
}
.col-card.alimentos:hover .col-visual img{transform:scale(1.03)}
.col-card.sintacc .col-visual{
  background:#eaf5ec;
  height:300px;
  padding:0;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
}
.col-card.sintacc .col-visual img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .3s ease;
}
.col-card.sintacc:hover .col-visual img{transform:scale(1.03)}
.col-card.fumadores .col-visual{
  background:var(--ink);
  height:300px;
  padding:0;
  display:block;
}

.fum-visual-inner{display:flex;gap:16px;align-items:center}
.fum-vis-block{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:20px 18px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  min-width:110px;
}
.fum-vis-icon{font-size:32px}
.fum-vis-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:#fff}
.fum-vis-tag{font-size:10px;color:rgba(255,255,255,.4)}


.col-cta{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(26,26,24,.72);color:#fff;
  font-size:12px;font-weight:500;letter-spacing:.06em;
  padding:6px 16px;border-radius:20px;
  backdrop-filter:blur(4px);pointer-events:none;
  white-space:nowrap;z-index:2;
}
.col-foot{
  padding:18px 22px;
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--border);
}
.col-foot-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--ink)}
.col-foot-sub{font-size:12px;color:var(--light);margin-top:3px}
.col-arrow{
  width:36px;height:36px;border-radius:50%;
  background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;flex-shrink:0;
  transition:background .15s;
}
.col-card:hover .col-arrow{background:var(--red)}

/* PROMO STRIP */
.promo-strip{
  background:var(--ink);border-radius:16px;
  padding:2.5rem 3rem;margin-bottom:5rem;
  display:flex;align-items:center;justify-content:space-between;gap:2rem;
}
.promo-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:#fff;margin-bottom:.5rem}
.promo-body{font-size:14px;color:rgba(255,255,255,.5);max-width:420px;line-height:1.6}
.promo-cta{
  background:var(--red);color:#fff;border:none;
  border-radius:8px;padding:12px 24px;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:background .15s;flex-shrink:0;
}
.promo-cta:hover{background:var(--red-dark)}

/* SECTION WRAP */
.section-wrap{max-width:1140px;margin:0 auto;padding:2.5rem 2.5rem 4rem}
.breadcrumb{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--light);
  margin-bottom:2rem;cursor:pointer;
}
.breadcrumb:hover{color:var(--mid)}
.breadcrumb .bc-active{color:var(--ink2);font-weight:500}
.section-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(26px,3.5vw,42px);font-weight:900;
  color:var(--ink);margin-bottom:.5rem;
}

.brand-header-logo{margin-bottom:.25rem}
.brand-header-logo img{height:52px;max-width:200px;object-fit:contain;display:block}
@media(max-width:720px){.brand-header-logo img{height:44px;max-width:160px}}
.section-rule{width:36px;height:2px;background:var(--red);margin:.4rem 0 .4rem}
.section-meta{font-size:13px;color:var(--light);margin-bottom:1rem;letter-spacing:.02em}

.brands-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:3rem}
.brand-tile-lg{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
  cursor:pointer;text-align:center;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.brand-tile-lg:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 8px 24px rgba(26,26,24,.08)}
.btl-logo{width:100%;height:100px;object-fit:contain;padding:12px;display:block;background:var(--white)}
.btl-logo.logo-elements{padding:2px;height:130px;object-fit:contain}
.btl-emoji{font-size:30px;margin:20px 0 8px;display:block}
.btl-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--ink);padding:0 8px}
.btl-count{font-size:11px;color:var(--light);margin:4px 0 14px;display:block}

/* BRAND PAGE */
.toolbar{display:flex;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.search-wrap input{
  width:100%;padding:10px 14px 10px 38px;
  border:1px solid var(--border);border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:13px;
  background:var(--white);color:var(--ink);outline:none;
  transition:border-color .15s;
}
.search-wrap input:focus{border-color:var(--red)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{
  background:var(--white);border:1px solid var(--border);
  border-radius:20px;padding:6px 14px;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;
  cursor:pointer;color:var(--mid);transition:all .15s;
}
.fbtn:hover{border-color:var(--red);color:var(--red)}
.fbtn.active{background:var(--red);border-color:var(--red);color:#fff}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.prod-card{
  background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:1.1rem;
  display:flex;flex-direction:column;gap:9px;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.prod-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,26,24,.07)}
.prod-card.flash{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,42,42,.18);animation:flashPulse 1.6s ease-out}
@keyframes flashPulse{0%{box-shadow:0 0 0 0 rgba(192,42,42,.45)}70%{box-shadow:0 0 0 14px rgba(192,42,42,0)}100%{box-shadow:0 0 0 0 rgba(192,42,42,0)}}

/* GLOBAL PREDICTIVE SEARCH */
.gsearch{position:sticky;top:62px;z-index:55;background:var(--cream);border-bottom:1px solid var(--border);padding:8px 2.5rem}
.gsearch-wrap{max-width:1200px;margin:0 auto;position:relative}
.gsearch-input{width:100%;padding:10px 36px 10px 38px;border:1.5px solid var(--border);border-radius:10px;background:var(--white);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
.gsearch-input::placeholder{color:#B0AA9E}
.gsearch-input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,42,42,.08)}
.gsearch-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;display:flex;align-items:center}
.gsearch-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--mid);width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center}
.gsearch-clear.visible{display:flex}
.gsearch-clear:hover{background:var(--cream)}
.gsearch-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--white);border:1.5px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(26,26,24,.14);max-height:64vh;overflow-y:auto;z-index:65;display:none}
.gsearch-results.visible{display:block}
.gsr-item{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.gsr-item:last-child{border-bottom:0}
.gsr-item:hover,.gsr-item.kbsel{background:var(--cream)}
.gsr-img{width:42px;height:42px;border-radius:7px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.gsr-img img{width:100%;height:100%;object-fit:contain;padding:2px;box-sizing:border-box;display:block}
.gsr-text{flex:1;min-width:0}
.gsr-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsr-meta{font-size:11px;color:var(--mid);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsr-price{font-size:12px;color:var(--red);font-weight:700;margin-left:8px;flex-shrink:0;white-space:nowrap}
.gsr-empty{padding:18px;text-align:center;color:var(--mid);font-size:13px}

.prod-icon{
  height:210px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:54px;background:var(--cream);
  overflow:hidden;
}
.prod-icon img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.18);transform-origin:center;cursor:zoom-in}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.lightbox.open{display:flex}
.lb-img{max-width:96vw;max-height:90vh;object-fit:contain;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:auto}
.lb-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:26px;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.lb-close:hover{background:rgba(255,255,255,.3)}
.lb-controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:2}
.lb-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.lb-btn:hover{background:rgba(255,255,255,.3)}
.lb-hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:11px;background:rgba(0,0,0,.5);padding:6px 14px;border-radius:20px;z-index:2;opacity:.85;letter-spacing:.05em;text-transform:uppercase;font-weight:500}

.prod-art{font-size:10px;color:var(--light);letter-spacing:.06em;text-transform:uppercase}
.prod-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;line-height:1.3;color:var(--ink)}
.prod-present{font-size:11px;color:var(--mid)}
.prices-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:2px 0}
.price-box{border:1.5px solid var(--border);border-radius:8px;padding:7px 8px;cursor:pointer;transition:all .15s;text-align:center}
.price-box:hover{border-color:var(--border2)}
.price-box.selected{border-color:var(--red);background:var(--red-light)}
.price-box-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--light);margin-bottom:2px}
.price-box-val{font-size:17px;font-weight:600;color:var(--ink)}
.price-box.selected .price-box-label{color:var(--red)}
.price-box.selected .price-box-val{color:var(--red)}
.prod-pu{font-size:22px;font-weight:500;color:var(--ink)}
.prod-pu em{font-size:11px;font-style:normal;color:var(--light)}
.prod-pc{font-size:13px;color:var(--ink2);font-weight:500;margin-top:2px}
.prod-unit-ref{font-size:13px;color:var(--ink2);font-weight:500;margin-top:3px}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:2px}
.qbtn{
  width:28px;height:28px;border:1px solid var(--border);
  border-radius:6px;background:var(--cream);
  cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--mid);transition:border-color .1s;
}
.qbtn:hover{border-color:var(--border2)}
.qnum{font-size:14px;min-width:20px;text-align:center;font-weight:500;color:var(--ink)}
.abtn{
  flex:1;background:var(--ink);color:#fff;border:none;
  border-radius:7px;padding:8px;font-size:12px;font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .15s;
}
.abtn:hover{background:var(--ink2)}
.abtn.added{background:#1E6B3C}
.prod-card.baja-rot{border-style:dashed;opacity:.85}
.baja-rot-tag{font-size:10px;color:var(--mid);background:var(--cream2);border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:2px}

/* SIN TACC STRIP */
.sintacc-strip{
  background:var(--white);border:1px solid var(--border);border-radius:16px;
  padding:1.5rem 2rem;margin-bottom:3rem;
  display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s;
  position:relative;overflow:hidden;
}
.sintacc-strip::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#3a7d44,#5aab6a);border-radius:4px 0 0 4px;
}
.sintacc-strip:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(26,26,24,.09)}
.sintacc-left{display:flex;align-items:center;gap:1.25rem;flex:1;min-width:0}
.sintacc-badge{
  width:48px;height:48px;border-radius:12px;flex-shrink:0;
  background:#eaf5ec;display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.sintacc-texts{}
.sintacc-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#3a7d44;font-weight:600;margin-bottom:3px}
.sintacc-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--ink);line-height:1.1}
.sintacc-sub{font-size:12px;color:var(--mid);margin-top:3px}
.sintacc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sintacc-tag{font-size:10px;background:#eaf5ec;color:#3a7d44;border-radius:20px;padding:3px 9px;font-weight:500;border:1px solid #c4e0c8}
.sintacc-arrow{
  width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;
  transition:background .15s;
}
.sintacc-strip:hover .sintacc-arrow{background:#3a7d44}
@media(max-width:720px){
  .sintacc-strip{padding:1.25rem 1.25rem 1.25rem 1.5rem;gap:1rem}
  .sintacc-title{font-size:16px}
}

/* SINTACC PAGE */
.sintacc-brand-group{margin-bottom:2rem}
.sintacc-brand-hdr{display:flex;align-items:center;gap:10px;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.sintacc-brand-logo{height:32px;max-width:90px;object-fit:contain}
.sintacc-brand-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink)}
.sintacc-brand-count{font-size:11px;color:var(--light);margin-left:auto}

.sintacc-brand-desc{font-size:12px;color:var(--mid);margin-bottom:.75rem;line-height:1.5;padding:8px 10px;background:#f0f7f1;border-radius:8px;border-left:3px solid #3a7d44}
.brand-desc-strip{font-size:12px;color:var(--mid);line-height:1.5;padding:8px 12px;background:var(--cream);border-radius:8px;margin-bottom:1rem;border-left:3px solid var(--border2)}

/* HOME REDESIGN */
.home-cats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}

/* Banner base */
.home-banner{
  border:1px solid var(--border);border-radius:14px;overflow:hidden;
  cursor:pointer;transition:transform .18s,box-shadow .18s;
  display:flex;align-items:center;gap:14px;padding:14px 18px;
  background:var(--white);
}
.home-banner:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,26,24,.09)}

<script>
const WA='59896190002';
// ── Configuración GitHub ─────────────────────────────────────────────────────
const GH_OWNER = 'fdovat-cell';
const GH_REPO  = 'pelsas-distribuidora';
const GH_BRANCH = 'main';
const DATA_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/data.json`;

let brands = [];
let products = {};

let cart={},qtys={},view='home',curBrand=null,activeFilter='todos',checkout=false,done=false,pagoMethod='';
const fmt=n=>'$'+n.toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});
const allP=()=>Object.values(products).flat().filter(p=>p.activo!==false);
const getBrand=id=>brands.find(b=>b.id===id);
const alBrands=()=>brands.filter(b=>b.sid==='alimentos'&&b.activo!==false);
const fumBrands=()=>brands.filter(b=>b.sid==='fumadores'&&b.activo!==false);
const alCount=()=>alBrands().reduce((a,b)=>(products[b.id]||[]).filter(p=>p.activo!==false).length+a,0);
const fumCount=()=>fumBrands().reduce((a,b)=>(products[b.id]||[]).filter(p=>p.activo!==false).length+a,0);

async function initApp() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    brands   = data.brands   || [];
    products = data.products || {};
    Object.values(products).flat().forEach(p=>{qtys[p.id]=1});
    render();
  } catch(e) {
    console.error('Error cargando catálogo:', e);
    document.getElementById('main-view').innerHTML =
      '<div style="text-align:center;padding:4rem 2rem;color:#7A7468">' +
      '<div style="font-size:48px;margin-bottom:1rem">⚠️</div>' +
      '<div style="font-size:16px;margin-bottom:.5rem">No se pudo cargar el catálogo</div>' +
      '<div style="font-size:13px">Revisá tu conexión e intentá de nuevo</div>' +
      '<button onclick="initApp()" style="margin-top:1.5rem;padding:10px 24px;background:#1A1A18;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">Reintentar</button>' +
      '</div>';
  }
}

function render(){
  pushState(view,curBrand);
  const mv=document.getElementById('main-view');
  if(view==='home')mv.innerHTML=renderHome();
  else if(view==='section')mv.innerHTML=renderSection();
  else if(view==='brand')mv.innerHTML=renderBrandPage();
  else if(view==='fumadores')mv.innerHTML=renderFumadores();
  else if(view==='sintacc')mv.innerHTML=renderSintacc();
  else if(view==='catalogo')mv.innerHTML=renderCatalogo();
  else if(view==='fichas')mv.innerHTML=renderFichas();
  const back=document.getElementById('back-btn');
  if(back)back.classList.toggle('visible',view!=='home');
  document.querySelectorAll('.bn-item').forEach(b=>b.classList.remove('active'));
  if(view==='home')document.getElementById('bn-home')?.classList.add('active');
  else if(view==='section'||view==='brand'||view==='fumadores'||view==='sintacc')document.getElementById('bn-marcas')?.classList.add('active');
  else if(view==='catalogo')document.getElementById('bn-catalogo')?.classList.add('active');
  else if(view==='fichas')document.getElementById('bn-fichas')?.classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
}
function goBack(){
  if(view==='brand'){
    const b=getBrand(curBrand);
    if(b&&b.sid==='fumadores')goFumadores();
    else if(curBrand&&['celisano','agridulce','smams','sanosinharina','suavipan','nutsbar','molinosala'].includes(curBrand)&&prevView==='sintacc')goSintacc();
    else goSection();
  } else if(view==='section'||view==='fumadores'||view==='sintacc'||view==='catalogo'||view==='fichas')goHome();
}
let prevView='home';
let catTab='alimentos';
function goSintacc(){prevView=view;view='sintacc';curBrand=null;activeFilter='todos';render()}

function setCatTab(tab){catTab=tab;document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));document.getElementById('cattab-'+tab)?.classList.add('active');document.getElementById('cat-content').innerHTML=renderCatContent()}

const freeIds=new Set(['celisano','agridulce','smams','sanosinharina','suavipan','nutsbar','molinosala']);
const freeProdCats=new Set(['sin gluten','sin azucar','sin lactosa','budines','proteina','bombones']);
function isFree(bid,p){
  if(freeIds.has(bid))return true;
  if(bid==='agridulce'&&p.cat==='sin azucar')return true;
  if(bid==='smams'&&(p.cat==='sin gluten'||p.cat==='sin azucar'))return true;
  return false;
}

function renderCatContent(){
  const sid=catTab;
  const blist=brands.filter(b=>b.sid===sid);
  return blist.map(b=>{
    const ps=products[b.id]||[];
    if(!ps.length)return'';
    const hasFree=freeIds.has(b.id)||(b.id==='agridulce'&&ps.some(p=>p.cat==='sin azucar'))||(b.id==='smams'&&ps.some(p=>p.cat==='sin gluten'||p.cat==='sin azucar'));
    return`<div class="cat-brand-block">
      <div class="cat-brand-hdr">
        <img class="cat-brand-logo" src="${b.logo}" alt="${b.name}" onerror="this.outerHTML='<span style=\\'font-size:22px\\'>${b.emoji}</span>'">
        <span class="cat-brand-name">${b.name}</span>
        ${hasFree?`<span class="cat-free-badge">🌿 Free</span>`:''}
        <span class="cat-brand-count">${ps.length} prod.</span>
      </div>
      <div class="cat-prod-grid">${ps.map(p=>{
        const free=isFree(b.id,p);
        const k=p.id+'_'+(p.venta===1?'unit':'caja');
        const inCart=cart[k]&&cart[k].qty>0;
        return`<div class="cat-prod-card${free?' free-highlight':''}">
          <img class="cat-prod-img" src="${getProdImg(b.id,p.art)}" alt="${p.name}" onerror="this.onerror=null;this.src='img/placeholder.webp'" onclick="openLB('img/${p.art}.webp')">
          <div class="cat-prod-body">
            <div class="cat-prod-name">${p.name}</div>
            <div class="cat-prod-prices">
              <div class="cat-prod-price-pack">Pack $${p.caja.toFixed(0)}</div>
              <div class="cat-prod-price-unit">$${p.unit.toFixed(0)} c/u</div>
            </div>
          </div>
          <button class="cat-prod-add${inCart?' in-cart':''}" onclick="addC('${p.id}')">${inCart?'✓':'+ Agregar'}</button>
        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}

}
function openFicha(bid){
  const img=new Image();
  img.onload=()=>openLBraw('img/fichas/'+bid+'.jpg');

function sintaccBrands(){
  const ids=['nutsbar','molinosala','celisano','agridulce','smams','sanosinharina','suavipan'];
  return ids.map(id=>getBrand(id)).filter(Boolean);
}
function sintaccProducts(bid){
  const all=products[bid]||[];
  if(bid==='celisano'||bid==='sanosinharina'||bid==='suavipan'||bid==='nutsbar'||bid==='molinosala')return all;
  if(bid==='agridulce')return all.filter(p=>p.cat==='sin azucar');
  if(bid==='smams')return all.filter(p=>p.cat==='sin gluten'||p.cat==='sin azucar');

}
const brandGenImg={

  if(hasOwnPhoto.has(art))return`img/${art}.webp`;
  if(brandGenImg[bid])return brandGenImg[bid];
  return`img/${art}.webp`;
}
const brandDesc={
  nutsbar:'Sin gluten · Sin azúcares agregados (Stevia) · Sin sodio agregado. Barras de cereales y bombones naturales.',
  molinosala:'Tostaditas de arroz naturalmente libres de gluten. Ideales para celíacos y quienes buscan alternativas livianas al trigo.',

  suavipan:'Budines individuales zero azúcar en distintos sabores. Sin azúcar agregada, ideales para quienes cuidan su ingesta calórica.',

  mazarena:'Alfajores artesanales de receta tradicional uruguaya.',
  agridulce_gen:'Barras de cereal en variantes clásicas y sin azúcar.',
  rebelnut:'Barras veganas elaboradas con ingredientes naturales.',
  granolate:'Alfajores de granola artesanales.',
  santaelena:'Maní en variedad de presentaciones y sabores.',
  lorenz:'Papas naturals artesanales en sabores premium. Elaboradas con papas seleccionadas, horneadas con ingredientes naturales.',
};
function getBrandDesc(bid){return brandDesc[bid]||''}
function sintaccCount(){return sintaccBrands().reduce((a,b)=>a+sintaccProducts(b.id).length,0)}

            </div>
            <div class="col-foot">
              <div>
                <div class="col-foot-name">Alimentos &amp; Snacks</div>

              <div class="col-cta" style="background:rgba(58,125,68,.75)">Ver catálogo →</div>

                <div class="col-foot-name" style="color:#2d6235">Sin TACC / Sin Azúcar</div>

function renderSection(){
  return`<div class="section-wrap">

    <div class="brands-grid">
      ${alBrands().map(b=>`<div class="brand-tile-lg" onclick="goBrand('${b.id}')">
        <img class="btl-logo${b.id==='elements'?' logo-elements':''}" src="${b.logo}" alt="${b.name}" onerror="this.outerHTML='<span class=\\'btl-emoji\\'>${b.emoji}</span>'">

        <span class="btl-count">${(products[b.id]||[]).length} productos</span>
      </div>`).join('')}

function renderBrandPage(){
  const b=getBrand(curBrand);
  const ps=products[curBrand]||[];
  const cats=['todos',...new Set(ps.map(p=>p.cat))];
  const secLabel=b.sid==='fumadores'?'Artículos para fumadores':'Alimentos &amp; Snacks';
  const secFn=b.sid==='fumadores'?'goFumadores()':'goSection()';
  const bName=b.name;const bEmoji=b.emoji;
  return`<div class="section-wrap">
    <div class="breadcrumb" onclick="${secFn}">← ${secLabel} / <span class="bc-active">${b.name}</span></div>
    <div class="brand-header-logo"><img src="${b.logo}" alt="${b.name}" onerror="this.outerHTML='<div class=\'section-title\'>${bEmoji} ${bName}</div>'"></div>
    <div class="section-rule"></div>
    <div class="section-meta">${ps.length} productos · precios con IVA incluido</div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="#B0AA9E" stroke-width="1.5"/><path d="m11 11 3 3" stroke="#B0AA9E" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" id="sinput" placeholder="Buscar por nombre o artículo..." oninput="reGrid()">
      </div>

        ${cats.map(c=>`<button class="fbtn${activeFilter===c?' active':''}" onclick="setF('${c}',this)">${c==='baja rotacion'?'consultar disp.':c}</button>`).join('')}
      </div>
    </div>
    <div class="prod-grid" id="pgrid">${renderCards(getFiltered(ps),curBrand)}</div>
  </div>`;
}

function getFiltered(ps){
  const q=((document.getElementById('sinput')||{}).value||'').toLowerCase();
  return ps.filter(p=>{
    const mc=activeFilter==='todos'||p.cat===activeFilter;
    const mq=!q||p.name.toLowerCase().includes(q)||p.art.includes(q);
    return mc&&mq;
  });
}

function renderCards(filtered,bid){
  if(!filtered.length)return'<div class="empty-g">Sin resultados</div>';
  return filtered.map(p=>{
    const modo=p.venta===1?'unit':'caja';
    const cartKey=p.id+'_'+modo;
    const inCart=cart[cartKey]>0;
    const isBaja=p.cat==='baja rotacion';
    const imgSrc=bid?getProdImg(bid,p.art):`img/${p.art}.webp`;
    const genImg=bid&&brandGenImg[bid]?brandGenImg[bid]:'';
    const onerrorFallback=genImg?`this.onerror=null;this.src='${genImg}'`:`this.onerror=null`;
    const precioMostrado=modo==='unit'?p.unit:p.caja;
    return`<div class="prod-card${isBaja?' baja-rot':''}" data-pid="${p.id}">
      ${isBaja?'<span class="baja-rot-tag">Consultar disponibilidad</span>':''}
      <div class="prod-icon"><img src="${imgSrc}" alt="${p.name}" loading="lazy" onclick="openLB('${p.art}')" onerror="${onerrorFallback}"></div>
      <div class="prod-art">Art. ${p.art}</div>
      <div class="prod-name">${p.name}</div>
      <div class="prod-present">${p.present}</div>

        <div class="prod-pu">${fmt(precioMostrado)}<em> / ${modo==='unit'?'unidad':'pack'}</em></div>

}

function goHome(){view='home';curBrand=null;activeFilter='todos';render()}
function goSection(){view='section';render()}
function goBrand(id){view='brand';curBrand=id;activeFilter='todos';render()}
function goFumadores(){view='fumadores';render()}
function goMarcas(){
  if(view==='fumadores'||(view==='brand'&&getBrand(curBrand)?.sid==='fumadores'))goFumadores();
  else goSection();
}
function setF(f,btn){activeFilter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');reGrid()}
function chQ(id,d){qtys[id]=Math.max(1,(qtys[id]||1)+d);const el=document.getElementById('q'+id);if(el)el.textContent=qtys[id]}
function addC(id){
  const p=allP().find(x=>x.id===id);if(!p)return;
  const modo=p.venta===1?'unit':'caja';
  const precio=modo==='unit'?p.unit:p.caja;
  const label=modo==='unit'?'unidad':'pack';
  const cartKey=id+'_'+modo;
  if(!cart[cartKey])cart[cartKey]={qty:0,precio,label,pid:id};
  cart[cartKey].qty+=(qtys[id]||1);
  updateBadge();reGrid();
}
function updateBadge(){
  const n=Object.values(cart).reduce((a,b)=>a+(b.qty||0),0);
  document.getElementById('cart-count').textContent=n;
  const bn=document.getElementById('bn-badge');
  if(bn){bn.textContent=n;bn.classList.toggle('zero',n===0)}
}
function toggleCart(){
  document.getElementById('cart-panel').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
  checkout=false;done=false;renderCart()
}
function renderCart(){
  const body=document.getElementById('cart-body');
  const foot=document.getElementById('cart-foot-area');

    body.innerHTML=`<div class="confirm-box"><div class="confirm-icon">✅</div><div class="confirm-ttl">¡Pedido enviado!</div><div class="confirm-txt">Abrimos WhatsApp con el detalle.<br>Te contactamos a la brevedad.<br><br><span class="confirm-tel">PelSAS · 096 190 002</span></div><button class="new-btn" onclick="newOrder()">Nuevo pedido</button></div><div class="pwa-install-box" id="pwa-box"><div class="pwa-install-title">¿Querés tener PelSAS siempre a mano?</div><div class="pwa-install-sub">Instalá la app en tu celular y accedé directo, sin abrir el navegador.</div><button class="pwa-install-btn" onclick="installPWA()">Instalar PelSAS</button></div>`;
    setTimeout(showInstallPrompt, 300);
    foot.innerHTML='';return;
  }
  if(!keys.length){body.innerHTML=`<div class="empty-cart-box"><span class="empty-cart-icon">🛒</span>El pedido está vacío.</div>`;foot.innerHTML='';return}

  body.innerHTML=keys.map(k=>{
    const item=cart[k];
    const p=allP().find(x=>x.id===item.pid);if(!p)return'';
    const br=brands.find(x=>products[x.id]&&products[x.id].find(pp=>pp.id===item.pid));
    const sub=item.precio*item.qty;total+=sub;
    return`<div class="cart-item"><span class="ci-em">${p.emoji}</span><div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-brand">${br?br.name:''} · ${item.label}</div><div class="ci-price">${fmt(sub)}</div><div class="ci-act"><button class="sqb" onclick="cQ('${k}',-1)">−</button><span class="ci-qty">${item.qty}</span><button class="sqb" onclick="cQ('${k}',1)">+</button><button class="rm-btn" onclick="rmItem('${k}')">Eliminar</button></div></div></div>`;
  }).join('');
  if(checkout){
    foot.innerHTML=`<div class="pago-selector">
      <div class="pago-sel-title">¿Cómo vas a pagar?</div>
      <div class="pago-sel-opts">
        <button class="pago-sel-btn${pagoMethod==='transferencia'?' selected':''}" onclick="selPago('transferencia')"><span class="pago-sel-icon">🏦</span>Transferencia bancaria</button>
        <button class="pago-sel-btn${pagoMethod==='qr'?' selected':''}" onclick="selPago('qr')"><span class="pago-sel-icon">📱</span>QR Brou</button>
        <button class="pago-sel-btn${pagoMethod==='entrega'?' selected':''}" onclick="selPago('entrega')"><span class="pago-sel-icon">🚚</span>Contra entrega (efectivo o cheque)</button>
      </div>
    </div>
    <div class="cart-foot"><div class="total-row"><span class="total-lbl">Total estimado</span><span class="total-val">${fmt(total)}</span></div><div class="checkout-form"><label>Nombre o negocio</label><input type="text" id="cfn" placeholder="Tu nombre o razón social"><label>WhatsApp</label><input type="text" id="cft" placeholder="09x xxx xxx"><label>Dirección</label><input type="text" id="cfd" placeholder="Calle, número, ciudad"><label>Notas</label><textarea id="cfno" rows="2" placeholder="Horario, indicaciones..."></textarea></div><button class="wsp-btn" onclick="sendOrder()" style="margin-top:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.118 1.528 5.855L.057 23.428a.75.75 0 00.916.916l5.573-1.471A11.95 11.95 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.651-.511-5.168-1.401l-.371-.219-3.849 1.016 1.016-3.849-.219-.371A9.953 9.953 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>Enviar por WhatsApp</button></div>`;
  } else {
    foot.innerHTML=`<div class="cart-foot"><div class="total-row"><span class="total-lbl">Total estimado</span><span class="total-val">${fmt(total)}</span></div><button class="step-btn" onclick="showCheckout()">Confirmar y enviar por WhatsApp →</button><button class="new-btn" style="width:100%;margin-top:8px;text-align:center" onclick="toggleCart()">← Seguir agregando</button></div>`;
  }
}
function cQ(k,d){if(!cart[k])return;cart[k].qty=Math.max(1,cart[k].qty+d);updateBadge();renderCart()}
function rmItem(k){delete cart[k];updateBadge();renderCart();if(view==='brand')reGrid()}
function selPago(m){pagoMethod=m;renderCart()}
function showCheckout(){checkout=true;pagoMethod='';renderCart()}
function sendOrder(){
  const n=(document.getElementById('cfn')||{}).value||'';
  const t=(document.getElementById('cft')||{}).value||'';
  const d=(document.getElementById('cfd')||{}).value||'';
  const no=(document.getElementById('cfno')||{}).value||'';
  if(!n||!t){alert('Completá nombre y teléfono');return}
  if(!pagoMethod){alert('Seleccioná un método de pago');return}
  const pagoLabels={transferencia:'🏦 Transferencia bancaria',qr:'📱 QR Brou',entrega:'🚚 Contra entrega (efectivo o cheque)'};
  const keys=Object.keys(cart).filter(k=>cart[k]&&cart[k].qty>0);
  let msg='*Pedido PelSAS*\n\n';let total=0;
  keys.forEach(k=>{
    const item=cart[k];
    const p=allP().find(x=>x.id===item.pid);if(!p)return;
    const br=brands.find(x=>products[x.id]&&products[x.id].find(pp=>pp.id===item.pid));
    const sub=item.precio*item.qty;total+=sub;
    msg+=`• ${br?br.name+' · ':''}${p.name} (${item.label})\n  ${item.qty} × $${item.precio.toFixed(2)} = $${sub.toFixed(2)}\n`;
  });
  msg+=`\n*Total estimado: $${total.toFixed(2)}*\n\n💳 Pago: ${pagoLabels[pagoMethod]}\n\n👤 ${n}\n📱 ${t}`;
  if(d)msg+=`\n📍 ${d}`;if(no)msg+=`\n📝 ${no}`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
  cart={};pagoMethod='';updateBadge();done=true;renderCart();if(view==='brand')reGrid();
}
function newOrder(){done=false;toggleCart()}
function waConsulta(){window.open(`https://wa.me/${WA}?text=${encodeURIComponent('Hola! Quería hacer una consulta.')}`,'_blank')}
function reGrid(){const g=document.getElementById('pgrid');if(!g)return;g.innerHTML=renderCards(getFiltered(products[curBrand]||[]),curBrand)}

/* BUSCADOR PREDICTIVO */
function _norm(s){return(s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function onGSearch(){
  const inp=document.getElementById('gsinput');
  const cl=document.getElementById('gsclear');
  const res=document.getElementById('gsresults');
  const raw=inp.value.trim();
  const q=_norm(raw);
  cl.classList.toggle('visible',raw.length>0);
  if(q.length<2){res.classList.remove('visible');res.innerHTML='';return}
  const all=Object.entries(products).flatMap(([bid,arr])=>arr.map(p=>Object.assign({bid},p)));
  const matches=all.filter(p=>_norm(p.name).includes(q)||p.art.includes(q)).slice(0,10);
  if(!matches.length){
    res.innerHTML='<div class="gsr-empty">Sin resultados para "'+raw.replace(/[<>&]/g,'')+'"</div>';
  } else {
    res.innerHTML=matches.map(p=>{
      const b=getBrand(p.bid);
      return'<div class="gsr-item" onmousedown="gsGo(\''+p.bid+'\',\''+p.id+'\')">'
        +'<div class="gsr-img"><img src="img/'+p.art+'.webp" alt="" onerror="this.parentNode.innerHTML=\''+p.emoji+'\'"></div>'
        +'<div class="gsr-text"><div class="gsr-name">'+p.name+'</div>'
        +'<div class="gsr-meta">'+b.name+' · Art. '+p.art+'</div></div>'
        +'<div class="gsr-price">'+fmt(p.caja)+'</div>'
        +'</div>';
    }).join('');
  }
  res.classList.add('visible');
}
function onGSBlur(){setTimeout(()=>{const r=document.getElementById('gsresults');if(r)r.classList.remove('visible')},180)}
function clearGS(){
  const inp=document.getElementById('gsinput');
  inp.value='';
  document.getElementById('gsclear').classList.remove('visible');
  document.getElementById('gsresults').classList.remove('visible');
  inp.focus();
}
function gsGo(bid,pid){
  curBrand=bid;view='brand';activeFilter='todos';
  document.getElementById('gsinput').value='';
  document.getElementById('gsclear').classList.remove('visible');
  document.getElementById('gsresults').classList.remove('visible');
  document.getElementById('gsinput').blur();
  render();
  setTimeout(()=>{
    const card=document.querySelector('[data-pid="'+pid+'"]');
    if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.add('flash');setTimeout(()=>card.classList.remove('flash'),1700)}
  },80);
}

/* LIGHTBOX */
let lbScale=1,lbTx=0,lbTy=0,_lbInitDist=0,_lbInitScale=1,_lbPanX=0,_lbPanY=0,_lbInitTx=0,_lbInitTy=0;
function _lbApply(){const im=document.getElementById('lb-img');im.style.transform='translate('+lbTx+'px,'+lbTy+'px) scale('+lbScale+')'}
function lbReset(){lbScale=1;lbTx=0;lbTy=0;_lbApply()}
function openLB(art){
  const lb=document.getElementById('lightbox');
  const im=document.getElementById('lb-img');
  im.src='img/'+art+'.webp';
  lb.classList.add('open');lbReset();
  document.body.style.overflow='hidden';
}
function openLBraw(src){
  const lb=document.getElementById('lightbox');
  const im=document.getElementById('lb-img');
  im.src=src;
  lb.classList.add('open');lbReset();
  document.body.style.overflow='hidden';
}
function closeLB(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow=''}
function lbBgClose(e){if(e.target.id==='lightbox')closeLB()}
function lbZoom(d){lbScale=Math.max(1,Math.min(6,lbScale*(d>0?1.3:1/1.3)));if(lbScale===1){lbTx=0;lbTy=0}_lbApply()}
function _lbDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
function onLBTouchStart(e){
  if(e.touches.length===2){e.preventDefault();_lbInitDist=_lbDist(e.touches);_lbInitScale=lbScale}
  else if(e.touches.length===1&&lbScale>1){_lbPanX=e.touches[0].clientX;_lbPanY=e.touches[0].clientY;_lbInitTx=lbTx;_lbInitTy=lbTy}
}
function onLBTouchMove(e){
  if(e.touches.length===2){e.preventDefault();const d=_lbDist(e.touches);if(_lbInitDist>0)lbScale=Math.max(1,Math.min(6,_lbInitScale*(d/_lbInitDist)));_lbApply()}
  else if(e.touches.length===1&&lbScale>1){e.preventDefault();lbTx=_lbInitTx+(e.touches[0].clientX-_lbPanX);lbTy=_lbInitTy+(e.touches[0].clientY-_lbPanY);_lbApply()}
}
function onLBWheel(e){e.preventDefault();const d=-e.deltaY*0.0025;lbScale=Math.max(1,Math.min(6,lbScale*(1+d)));if(lbScale===1){lbTx=0;lbTy=0}_lbApply()}
function onLBDbl(e){e.preventDefault();if(lbScale>1)lbReset();else{lbScale=2.5;_lbApply()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('lightbox').classList.contains('open'))closeLB()});

/* HISTORY API */
function pushState(v,b){
  const state={view:v,brand:b};
  history.pushState(state,'','#'+v+(b?'-'+b:''));
}
window.addEventListener('popstate',function(e){
  if(e.state){
    view=e.state.view||'home';
    curBrand=e.state.brand||null;
    activeFilter='todos';
    renderOnly();
  } else {
    view='home';curBrand=null;activeFilter='todos';renderOnly();
  }
});
function renderOnly(){
  const mv=document.getElementById('main-view');
  if(view==='home')mv.innerHTML=renderHome();
  else if(view==='section')mv.innerHTML=renderSection();
  else if(view==='brand')mv.innerHTML=renderBrandPage();
  else if(view==='fumadores')mv.innerHTML=renderFumadores();
  else if(view==='sintacc')mv.innerHTML=renderSintacc();
  else if(view==='catalogo')mv.innerHTML=renderCatalogo();
  const back=document.getElementById('back-btn');
  if(back)back.classList.toggle('visible',view!=='home');
  document.querySelectorAll('.bn-item').forEach(b=>b.classList.remove('active'));
  if(view==='home')document.getElementById('bn-home')?.classList.add('active');
  else if(view==='section'||view==='brand'||view==='fumadores'||view==='sintacc')document.getElementById('bn-marcas')?.classList.add('active');
  else if(view==='catalogo')document.getElementById('bn-catalogo')?.classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
}

/* PWA */
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  _deferredPrompt=e;
});
function showInstallPrompt(){
  const box=document.getElementById('pwa-box');
  if(box&&_deferredPrompt)box.classList.add('visible');
}
function installPWA(){
  if(!_deferredPrompt)return;
  _deferredPrompt.prompt();
  _deferredPrompt.userChoice.then(()=>{
    _deferredPrompt=null;
    const box=document.getElementById('pwa-box');
    if(box)box.classList.remove('visible');
  });
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

initApp();
